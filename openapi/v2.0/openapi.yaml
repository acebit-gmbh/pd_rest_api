            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  summary: Insufficient permissions
                  value:
                    error:
                      code: 403
                      message: "This account does not have any of the server roles required for this operation."
                licenseLimit:
                  summary: Licensed number of users reached
                  value:
                    error:
                      code: 4032
                      message: "Number of registered clients 26 exceeds the number of installed licenses 25."
        "409":
          description: A user with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

