          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /secrets/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: approveSecret
      tags:
        - Secrets
      summary: Approve a pending secret (designated approver only)
      description: |
        Available to callers listed in the secret's `approver_ids`. The
        action is tallied against the configured quorum; once the quorum
        is reached the secret moves to status `approved`.
      responses:
        "204":
          description: Approval recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /secrets/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: rejectSecret
      tags:
        - Secrets
      summary: Reject a pending secret (designated approver only)
      responses:
        "204":
          description: Rejection recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /secrets/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: revokeSecret
      tags:
        - Secrets
      summary: Revoke a secret (author or admin)
      responses:
        "204":
          description: Secret revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Admin-scope secret sub-commands
  # ---------------------------------------------------------------------------
  /admin/secrets/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: adminApproveSecret
      tags:
        - Admin - Secrets
      summary: Approve a pending secret (admin)
      responses:
        "204":
          description: Approval recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/secrets/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: adminRejectSecret
      tags:
        - Admin - Secrets
      summary: Reject a pending secret (admin)
      responses:
        "204":
          description: Rejection recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/secrets/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: adminRevokeSecret
      tags:
        - Admin - Secrets
      summary: Revoke a secret (admin)
      responses:
        "204":
          description: Secret revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Admin user sub-resources
  # ---------------------------------------------------------------------------
  /admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: adminSetUserPassword
      tags:
        - Admin - Users
      summary: Set a user's password (admin)
      description: |
        Admin password reset. Unlike `/me/password`, this does not require
        the user's current password. Not allowed for the super-administrator
        account -- that must be changed via the Password Depot Server Manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  description: New password for the user
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User does not use standard authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{user_id}/passkeys:
    parameters:
      - $ref: "#/components/parameters/UserIdPath"
    get:
      operationId: adminListUserPasskeys
      tags:
        - Admin - Passkeys
      summary: List a user's registered passkeys (admin)
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of the user's passkeys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CredentialBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{user_id}/passkeys/{id}:
    parameters:
      - $ref: "#/components/parameters/UserIdPath"
      - $ref: "#/components/parameters/PasskeyId"
    delete:
      operationId: adminRevokeUserPasskey
      tags:
        - Admin - Passkeys
      summary: Revoke a user's passkey (admin)
      description: |
        Admins cannot register passkeys on behalf of a user (requires the
        user's authenticator); only deletion is exposed.
      responses:
        "204":
          description: Passkey revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Database sub-resources (document content, folder navigation)
  # ---------------------------------------------------------------------------
  /databases/{db}/children:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
    get:
      operationId: listDatabaseRootChildren
      tags:
        - Databases
      summary: List root-level folders and entries of a database
      description: |
        Returns the direct children of the database root: top-level folders
        and top-level entries, merged in a single paginated list.
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildrenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/folders/{folder_id}/children:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - $ref: "#/components/parameters/FolderIdPath"
    get:
      operationId: listFolderChildren
      tags:
        - Folders
      summary: List the folders and entries directly inside a folder
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildrenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/folders/{folder_id}/move:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - $ref: "#/components/parameters/FolderIdPath"
    post:
      operationId: moveFolder
      tags:
        - Folders
      summary: Move a folder to a different parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveEntryRequest"
      responses:
        "200":
          description: Folder moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/entries/{entry_id}/content:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - $ref: "#/components/parameters/EntryIdPath"
    get:
      operationId: downloadDocumentContent
      tags:
        - Entries
      summary: Download the binary content of a document entry
      description: |
        The entry must be of type `document`. Response is the raw file
        bytes. The `Content-Disposition` header carries the stored
        filename (sanitized per RFC 7230 quoted-string rules) and
        `Content-Type` is derived from the filename extension.
      responses:
        "200":
          description: Document content
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Form: `attachment; filename="<sanitized-name>"`'
              example: 'attachment; filename="report.pdf"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Entry is not of type `document`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Entry not found, or no content has been uploaded yet for this
            document entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: uploadDocumentContent
      tags:
        - Entries
      summary: Upload (or replace) the binary content of a document entry
      description: |
        Body is the raw file bytes, maximum 64 MB. The `Content-Disposition`
        header on the request (if present) sets the stored filename:
        `Content-Disposition: attachment; filename="report.pdf"`. CR/LF and
        other control characters are stripped from the stored name.
      parameters:
        - name: Content-Disposition
          in: header
          required: false
          schema:
            type: string
          description: 'Optional stored filename, e.g. `attachment; filename="report.pdf"`'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Upload succeeded; updated entry returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Entry is not of type `document`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from POST /auth/login

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------
  parameters:
    DatabaseId:
      name: id
      in: path
      required: true
      description: Database ID
      schema:
        type: string
        format: uuid

    DatabaseIdPath:
      name: db
      in: path
      required: true
      description: Database ID
      schema:
        type: string
        format: uuid

    FolderId:
      name: id
      in: path
      required: true
      description: Folder ID
      schema:
        type: string
        format: uuid

    EntryId:
      name: id
      in: path
      required: true
      description: Entry ID
      schema:
        type: string
        format: uuid

    PermissionId:
      name: id
      in: path
      required: true
      description: Permission ID
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: string
        format: uuid

    GroupId:
      name: id
      in: path
      required: true
      description: Group ID
      schema:
        type: string
        format: uuid

    AlertId:
      name: id
      in: path
      required: true
      description: Alert ID
      schema:
        type: string
        format: uuid

    SecretId:
      name: id
      in: path
      required: true
      description: Secret ID
      schema:
        type: string
        format: uuid

    PasskeyId:
      name: id
      in: path
      required: true
      description: Passkey credential ID (server-issued UUID for the passkey record)
      schema:
        type: string
        format: uuid

    UserIdPath:
      name: user_id
      in: path
      required: true
      description: User ID -- path parameter used by sub-resources under /admin/users/{user_id}
      schema:
        type: string
        format: uuid

    EntryIdPath:
      name: entry_id
      in: path
      required: true
      description: Entry ID -- path parameter used by sub-resources under /databases/{db}/entries/{entry_id}
      schema:
        type: string
        format: uuid

    FolderIdPath:
      name: folder_id
      in: path
      required: true
      description: Folder ID -- path parameter used by sub-resources under /databases/{db}/folders/{folder_id}
      schema:
        type: string
        format: uuid

    PaginationOffset:
      name: offset
      in: query
      required: false
      description: Number of items to skip (for pagination)
      schema:
        type: integer
        minimum: 0
        default: 0

    PaginationLimit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return. Values above the cap are clamped.
        Default: 100. Maximum: 1000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: |
        Malformed request. The request body could not be parsed as JSON, or a
        required field is missing, or an enum value is unknown. The response
        body uses the standard error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 400
              message: "Malformed JSON request body."

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 401
              message: "Invalid or expired access token"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 403
              message: "You do not have permission to perform this action"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 404
              message: "Resource not found"

    MethodNotAllowed:
      description: |
        The HTTP method is not supported for this endpoint. Per RFC 7231 §6.5.5
        the response carries an `Allow` header listing the supported methods.
      headers:
        Allow:
          schema:
            type: string
          description: Comma-separated list of methods supported by the target resource
          example: "GET, POST, PATCH, DELETE"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 405
              message: "Supported methods: GET POST PATCH DELETE"

    PayloadTooLarge:
      description: |
        The request body exceeds the allowed size limit. JSON endpoints cap at
        1 MB; the document-content upload endpoint caps at 64 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 413
              message: "Request body exceeds the allowed size limit."

    TooManyRequests:
      description: |
        The caller's IP address is temporarily blocked by the server's
        login-attempt throttle. Honor the `Retry-After` header and back off;
        retrying immediately will not shorten the lockout. Loopback addresses
        (`127.0.0.0/8`, `::1`) are exempt from the block list.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the block expires
          example: 1745
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 429
              message: "Your IP address has been blocked. Please contact your PD server administrator or try again later."

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Authentication ---
    LoginRequest:
      type: object
      description: |
        The required fields depend on the `auth` method:
        - `standard` (default): `user`, `pass`
        - `sspi`: `user`, `pass`
        - `negotiate`: (none -- SPNEGO handshake via `WWW-Authenticate`)
        - `azure` (deprecated): `id_token`
        - `oidc`: `idp`, `id_token`
      properties:
        auth:
          type: string
          enum:
            - standard
            - sspi
            - negotiate
            - azure
            - oidc
          default: standard
          description: |
            Authentication method. Defaults to `standard` if omitted.
            - `standard` -- Normal username/password authentication.
            - `sspi` -- SSPI (Kerberos / Negotiate / NTLM) with explicit Windows domain credentials supplied in `user` and `pass`.
            - `negotiate` -- Integrated Windows authentication. No credentials in the body; the server responds with `401 WWW-Authenticate: Negotiate` and the client completes a SPNEGO handshake on the same TCP connection using the caller's current identity.
            - `azure` -- (Deprecated) Azure AD / Entra ID. Use `oidc` instead.
            - `oidc` -- OpenID Connect via a registered identity provider.
        scope:
          type: string
          enum:
            - client
            - admin
          default: client
          description: |
            Session scope. Determines which endpoints are accessible.
            - `client` -- (Default) Normal client session. Access to databases, folders, entries, and search.
            - `admin` -- Server administration session. Access to all client endpoints plus `/admin/` management endpoints (databases CRUD, users, groups, permissions, alerts, secrets).
        user:
          type: string
          description: Username (required for `standard` and `sspi`)
        pass:
          type: string
          description: Password (required for `standard` and `sspi`)
        tfacode:
          type: string
          description: 6-digit two-factor authentication code (if enabled)
        idp:
          type: string
          description: Identity Provider ID from `/auth/oidc` (required for `oidc`)
        id_token:
          type: string
          description: |
            Identity token from the OIDC/Azure flow (required for `oidc` and
            `azure`). Must carry either (a) a signed OIDC `id_token` JWT, or
            (b) an opaque OAuth access token usable as a Bearer credential at
            the provider's `userinfo_endpoint`. It MUST NOT be a bare
            authorization `code`: the REST server performs no
            authorization-code exchange and never POSTs to the
            `token_endpoint`. It validates the supplied value directly (JWT
            signature/aud/exp via JWKS, then falls back to Bearer ->
            userinfo). The recommended client configuration is
            `response_type=id_token`. An invalid/expired/forged token, a bare
            code, or no matching local user yields HTTP `401`.

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Bearer token to use in the Authorization header

    OidcProvider:
      type: object
      properties:
        id:
          type: string
          description: Unique provider identifier
        provider_class:
          type: string
          description: Provider class name
        display_name:
          type: string
          description: Human-readable provider name
        discovery_endpoint:
          type: string
          format: uri
          description: OIDC discovery endpoint URL
        client_id:
          type: string
          description: OAuth 2.0 client ID
        redirect_uri:
          type: string
          format: uri
          description: Redirect URI after authentication
        scope:
          type: string
          description: OAuth 2.0 scopes (space-separated)
        response_type:
          type: string
          description: OAuth 2.0 response type

    # --- Databases ---
    DatabaseBasic:
      type: object
      description: |
        Fields returned for a database in EVERY context: list views
        (`GET /databases`, `GET /admin/databases`), client-scope detail
        views (`GET /databases/{id}`), and when embedded in other
        responses. Output of the server's `SaveDatabaseToJSON` with
        `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Database name (used as part of the storage filename)
        description:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Database:
      description: |
        Full database representation returned by
        `GET /admin/databases/{id}` for admin-scope callers. Extends
        `DatabaseBasic` with fields that require admin scope.
      allOf:
        - $ref: "#/components/schemas/DatabaseBasic"
        - type: object
          properties:
            size:
              type: integer
              format: int64
              description: On-disk size in bytes
              readOnly: true
            entries_count:
              type: integer
              description: Total number of entries in the database
              readOnly: true
            icons_count:
              type: integer
              description: Number of custom icons stored with the database
              readOnly: true
            disabled:
              type: boolean
            db_admins:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs designated as database administrators
            db_supervisors:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs designated as database supervisors
            include_server_supervisors:
              type: boolean
              description: Whether server-level supervisors can also act on this database

    # --- Folders ---
    FolderBasic:
      type: object
      description: |
        Fields returned for a folder in EVERY context -- list views and
        detail views. Folders and entries share a `type` discriminator
        so they can be returned together in the `/children` listings;
        `FolderBasic`/`Folder` objects always carry `"type": "folder"`.
        Output of the server's `SaveFolderToJSON` with
        `AFullRepresentation=False`.
      properties:
        type:
          type: string
          enum:
            - folder
          description: Discriminator distinguishing folders from entries in heterogeneous listings
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Folder display name
        icon:
          type: string
          description: Icon identifier (numeric or custom name, see `image_index`/`image_name`)
          readOnly: true
        importance:
          type: string
          description: Importance level (e.g., "low", "normal", "high")
        category:
          type: string
        tags:
          type: string
          description: Comma-separated tag list
        has_second_pass:
          type: boolean
          description: Whether this folder is protected by a second password
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Folder:
      description: |
        Full folder representation returned by detail endpoints. Extends
        `FolderBasic` with fields that are omitted from list responses.
      allOf:
        - $ref: "#/components/schemas/FolderBasic"
        - type: object
          properties:
            author:
              type: string
              format: uuid
              readOnly: true
              description: ID of the user who originally created the folder
            image_custom:
              type: boolean
              description: If true, use `image_name` as the custom image; otherwise use `image_index`
            image_index:
              type: integer
              description: Standard icon index (when `image_custom` is false)
            image_name:
              type: string
              description: Custom image name (when `image_custom` is true), e.g. "twitter.com"
            comments:
              type: string

    # --- Entries ---
    Entry:
      type: object
      description: |
        A credential entry. The `type` field discriminates between the
        different kinds of entries; type-specific fields are carried in a
        sub-object named after the type (e.g. `credit_card`, `license`,
        `identity`, `information`, `banking`, `document`, `rdp`, `putty`,
        `teamviewer`, `passkey`). For `password` and `custom` entries the
        common password fields (`pass`, `urls`, `custom_fields`, ...) are
        at the top level instead.
      properties:
        type:
          type: string
          enum:
            - password
            - custom
            - credit_card
            - license
            - identity
            - information
            - banking
            - document
            - rdp
            - putty
            - teamviewer
            - passkey
          description: Entry kind (discriminator)
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        url:
          type: string
          description: Primary URL (empty for types that don't have one)
        login:
          type: string
          description: Primary username / login
        has_second_pass:
          type: boolean
          description: Whether this entry is protected by a second password
          readOnly: true
        icon:
          type: string
          readOnly: true
        importance:
          type: string
        category:
          type: string
        tags:
          type: string
          description: Comma-separated tag list
        updated_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        # Full representation only (for type = password / custom)
        login_id:
          type: string
          description: Associated HTML element id or name for the login field
        pass:
          type: string
          description: Main password (only for `password` / `custom`)
        pass_id:
          type: string
          description: Associated HTML element id or name for the password field
        urls:
          type: array
          items:
            type: string
          description: Additional URLs associated with this entry
        is_link:
          type: boolean
        linked_item:
          type: string
          format: uuid
          nullable: true
          description: ID of the template entry this one links to (when `is_link` is true)
        is_template:
          type: boolean
        info_template:
          type: string
          nullable: true
          description: Template reference (only for `custom` entries)
        param_str:
          type: string
          description: Command-line parameters
        custom_fields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
          description: Additional name/value/type tuples (only for `password` / `custom`)
        author:
          type: string
          format: uuid
          readOnly: true
        image_custom:
          type: boolean
        image_index:
          type: integer
        image_name:
          type: string
        comments:
          type: string
        # Type-specific sub-objects. Only one of these is present per entry,
        # keyed by the `type` field above.
        credit_card:
          $ref: "#/components/schemas/EntryCreditCard"
        license:
          $ref: "#/components/schemas/EntryLicense"
        identity:
          $ref: "#/components/schemas/EntryIdentity"
        information:
          $ref: "#/components/schemas/EntryInformation"
        banking:
          $ref: "#/components/schemas/EntryBanking"
        document:
          $ref: "#/components/schemas/EntryDocument"
        rdp:
          $ref: "#/components/schemas/EntryRdp"
        putty:
          $ref: "#/components/schemas/EntryPutty"
        teamviewer:
          $ref: "#/components/schemas/EntryTeamViewer"
        passkey:
          $ref: "#/components/schemas/EntryPasskey"

    EntryCreditCard:
      type: object
      properties:
        card:
          type: string
          description: Card brand (e.g. "master_card", "visa", "discover")
        holder:
          type: string
        number:
          type: string
          description: 16-digit card number, space-separated
        valid_thru:
          type: string
          description: Expiry date in MM/YYYY form
        cvv:
          type: string
        phone:
          type: string
          description: Hotline telephone
        url:
          type: string
        online_user:
          type: string
        online_pass:
          type: string
        pin:
          type: string

    EntryLicense:
      type: object
      properties:
        product:
          type: string
        version:
          type: string
        reg_name:
          type: string
        key_1:
          type: string
        key_2:
          type: string
        url:
          type: string
        user:
          type: string
        pass:
          type: string
        purchase_date:
          type: string
          format: date
          nullable: true
        order_number:
          type: string
        reg_email:
          type: string

    EntryIdentity:
      type: object
      properties:
        account:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        company:
          type: string
        address_1:
          type: string
        address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
        phone:
          type: string
        website:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        mobile:
          type: string
        fax:
          type: string
        house:
          type: string

    EntryInformation:
      type: object
      properties:
        text:
          type: string

    EntryBanking:
      type: object
      description: Online banking entry (previously `ec_card`, renamed in v2.0)
      properties:
        url:
          type: string
        user:
          type: string
        pass:
          type: string
        holder:
          type: string
        account_number:
          type: string
          description: Legacy field -- preserved for migration from older DB formats
        bank_id:
          type: string
          description: Legacy field
        bank_name:
          type: string
        bic:
          type: string
        iban:
          type: string
        card_number:
          type: string
        phone:
          type: string
        legitimation_id:
          type: string
          description: Legitimation ID (used by some German banks)
        pin:
          type: string

    EntryDocument:
      type: object
      description: |
        Metadata for a document-type entry. Use
        `GET /databases/{db}/entries/{entry_id}/content` to fetch the
        actual binary content.
      properties:
        name:
          type: string
          description: Filename (as set via Content-Disposition on upload)
        type:
          type: string
          description: MIME type derived from the filename extension
        size:
          type: integer
          format: int64
          description: Content size in bytes

    EntryRdp:
      type: object
      properties:
        host:
          type: string
        user:
          type: string
        pass:
          type: string
        cmd_line:
          type: string

    EntryPutty:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
          description: Connection protocol (ssh, telnet, rlogin, ...)
        user:
          type: string
        pass:
          type: string
        key_file:
          type: string
        key_pass:
          type: string
        cmd_line:
          type: string

    EntryTeamViewer:
      type: object
      properties:
        partner_id:
          type: string
        pass:
          type: string
        mode:
          type: string
          description: TeamViewer mode

    EntryPasskey:
      type: object
      properties:
        url:
          type: string
        user:
          type: string
        alg:
          type: integer
          description: COSE algorithm ID
        sign_count:
          type: integer
          readOnly: true
        cred_id:
          type: string
        rp_id:
          type: string
        rp_name:
          type: string
        user_id:
          type: string
        key:
          type: string
          description: Public and private key material (encrypted at rest)

    MoveEntryRequest:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          format: uuid
          description: Target folder ID to move the entry into

    # --- Search ---
    # Search reuses the Entry schema in paginated responses.

    # --- Permissions ---
    Permission:
      type: object
      description: |
        A permission binds a principal (user OR group, identified by
        `principal_id`) to a database, optionally gated by a validity
        window and a seal workflow. The basic view returned in list
        responses carries only identity and validity; the full view (from
        `GET /admin/databases/{db}/permissions/{id}`) additionally
        includes the allow/deny right tokens and per-entry overrides.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        principal_id:
          type: string
          format: uuid
          description: |
            ID of the user OR group this permission applies to. Whether
            it's a user or group is resolved by lookup on the server.
        issuer_id:
          type: string
          format: uuid
          description: ID of the user who created the permission
          readOnly: true
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
        # Full representation only
        allow:
          type: array
          items:
            $ref: "#/components/schemas/RightToken"
          description: Database-level allow rights
        deny:
          type: array
          items:
            $ref: "#/components/schemas/RightToken"
          description: Database-level deny rights (override `allow`)
        entry_allow:
          type: array
          items:
            $ref: "#/components/schemas/ItemRightOverride"
          description: Per-entry or per-folder allow overrides
        entry_deny:
          type: array
          items:
            $ref: "#/components/schemas/ItemRightOverride"
          description: Per-entry or per-folder deny overrides
        seal_status:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          description: |
            Seal workflow state:
            * 0 = unset
            * 1 = set (seal configured, access requires approval)
            * 2 = waiting (approval requested)
            * 3 = approved
            * 4 = broken (one-time access already consumed)
        approver_ids:
          type: array
          items:
            type: string
            format: uuid
          description: User IDs designated as seal approvers

    RightToken:
      type: string
      description: |
        A single right on a database. These tokens also appear under
        `entry_allow` / `entry_deny` when narrowed to a specific
        entry or folder.
      enum:
        - use
        - read
        - update
        - create
        - delete
        - print
        - export
        - save
        - auto_complete
        - addon_fill
        - addon_offer
        - sync
        - share
        - seal
        - second_pass

    ItemRightOverride:
      type: object
      description: |
        Per-entry or per-folder override of a right. The `target_id`
        points at an entry or folder; `rights` lists the right tokens
        that are overridden for that target.
      properties:
        target_id:
          type: string
          format: uuid
        rights:
          type: array
          items:
            $ref: "#/components/schemas/RightToken"

    # --- Users ---
    UserBasic:
      type: object
      description: |
        Fields returned for a user in EVERY context -- both the detail
        response (`GET /me`, `GET /admin/users/{id}`) and the list
        response (`GET /admin/users`). This is the output of the server's
        `SaveUserToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Username (immutable once created)
        auth_modes:
          type: array
          items:
            type: string
            enum:
              - standard
              - sspi
              - iwa
              - azure
              - oidc
              - webauthn
          description: Authentication methods allowed for this user
        two_factor_mode:
          type: string
          enum:
            - default
            - disabled
            - email
            - totp
            - fido2
          description: |
            Per-user 2FA mode. `default` inherits the server-wide setting;
            `disabled` opts out (suitable for service accounts); `fido2` uses
            a registered passkey / security key as the second factor.
        display_name:
          type: string
          description: Friendly name (`FullName` internally)
        department:
          type: string
        email:
          type: string
        phone:
          type: string
          description: Mobile phone number
        updated_at:
          type: string
          format: date-time
          readOnly: true

    User:
      description: |
        Full user representation as returned by `GET /me` and
        `GET /admin/users/{id}`. Extends `UserBasic` with the detail-only
        fields. For the client-scope directory at `GET /users/{id}` use
        `UserCompact` instead.
      allOf:
        - $ref: "#/components/schemas/UserBasic"
        - type: object
          properties:
            sam:
              type: string
              description: Windows SAM account name (DOMAIN\username)
            upn:
              type: string
              description: User principal name (user@domain.local)
            dn:
              type: string
              description: Distinguished name (AD)
            objectId:
              type: string
              description: AD objectId (GUID)
            disabled:
              type: boolean
            must_change_pass:
              type: boolean
            cannot_change_pass:
              type: boolean
            roles:
              type: array
              items:
                type: string
                enum:
                  - super_admin
                  - server_admin
                  - db_admin
                  - user_admin
                  - group_admin
                  - ad_operator
                  - log_reader
              description: Server-level roles granted to this user
            member_of:
              type: array
              items:
                type: string
                format: uuid
              description: IDs of groups this user belongs to
            last_login:
              type: string
              format: date-time
              readOnly: true
            passkeys:
              type: array
              items:
                $ref: "#/components/schemas/Credential"
              readOnly: true
              description: Registered passkeys for this user (compact representation, public key not exposed)

    # --- Groups ---
    GroupBasic:
      type: object
      description: |
        Fields returned for a group in EVERY context -- both the detail
        response (`GET /admin/groups/{id}`) and the list response
        (`GET /admin/groups`). This is the output of the server's
        `SaveGroupToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        department:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Group:
      description: |
        Full group representation as returned by `GET /admin/groups/{id}`.
        Extends `GroupBasic` with the detail-only fields. For the
        client-scope directory use `GroupCompact` instead.
      allOf:
        - $ref: "#/components/schemas/GroupBasic"
        - type: object
          properties:
            dn:
              type: string
              description: Distinguished name (AD)
            objectId:
              type: string
              description: AD objectId (GUID)
            ad_sync:
              type: boolean
              description: Whether this group is synchronized with Active Directory
            member_of:
              type: array
              items:
                type: string
                format: uuid
              description: IDs of parent groups this group belongs to
            members:
              type: array
              items:
                type: string
                format: uuid
              readOnly: true
              description: Calculated list of user/group IDs that are members of this group
            admins:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs designated as administrators of this group

    # --- Alerts ---
    AlertBasic:
      type: object
      description: |
        Fields returned for an alert in EVERY context -- both the detail
        response (`GET /admin/alerts/{id}`) and the list response
        (`GET /admin/alerts`). Output of the server's `SaveAlertToJSON`
        with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Server-generated human-readable name
        type:
          type: string
          description: Event type identifier (e.g. `user_login`, `db_size_changes`)
        notes:
          type: string
          description: Free-form notes included in the notification body
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Alert:
      description: |
        Full alert representation returned by `GET /admin/alerts/{id}`.
        Extends `AlertBasic` with recipient list and the per-database /
        per-user / per-entry scope filters. When an event matching `type`
        occurs, the server sends an email to each address in
        `recipients`. Scope can be narrowed to specific databases,
        users, or entries via the `filter_by_*` / `*_ids` pairs.
      allOf:
        - $ref: "#/components/schemas/AlertBasic"
        - type: object
          properties:
            recipients:
              type: array
              items:
                type: string
                format: email
              description: Email addresses to notify (validated on write)
            filter_by_databases:
              type: boolean
            database_ids:
              type: array
              items:
                type: string
                format: uuid
            filter_by_users:
              type: boolean
            user_ids:
              type: array
              items:
                type: string
                format: uuid
            filter_by_entries:
              type: boolean
            entry_ids:
              type: array
              items:
                type: string
                format: uuid

    # --- Secrets ---
    SecretBasic:
      type: object
      description: |
        Fields returned for a secret in EVERY context -- both detail
        (`GET /secrets/{id}`, `GET /admin/secrets/{id}`) and list
        (`GET /secrets`, `GET /admin/secrets`). Output of the server's
        `SaveSecretToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          description: Secret type (discriminator)
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - revoked
            - consumed
            - expired
          description: Current lifecycle state
          readOnly: true
        protocol:
          type: string
          enum:
            - https
            - pd-server
          description: |
            URL scheme to use when generating the link:
            `https` (browser) or `pd-server` (native client).
        author:
          type: string
          format: uuid
          readOnly: true
        database_id:
          type: string
          format: uuid
        database_name:
          type: string
          readOnly: true
        entry_id:
          type: string
          format: uuid
        entry_path:
          type: string
          readOnly: true
          description: Human-readable path of the shared entry within its database
        entry_user:
          type: string
          readOnly: true
        entry_type:
          type: string
          readOnly: true
          description: Type of the shared entry (e.g. `password`, `document`, `credit_card`)
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    Secret:
      description: |
        Full secret representation returned by detail endpoints. Extends
        `SecretBasic` with the approval workflow, quorum settings, and
        the bearer UUIDs (`open_uuid`, `approve_uuid`) that must be
        treated as credentials. Sub-commands (`/approve`, `/reject`,
        `/revoke`) are separate endpoints.
      allOf:
        - $ref: "#/components/schemas/SecretBasic"
        - type: object
          properties:
            notes:
              type: string
            access_max:
              type: integer
              description: Maximum number of times the secret may be accessed (0 = unlimited)
            access_count:
              type: integer
              readOnly: true
              description: How many times the secret has been accessed
            include_totp:
              type: boolean
              description: Include a TOTP seed in the shared payload
            approval_required:
              type: boolean
            quorum_n:
              type: integer
              description: Required number of approvers in the M-of-N scheme
            quorum_m:
              type: integer
              description: Total number of approvers in the M-of-N scheme
            require_2fa:
              type: boolean
              description: Recipient must complete 2FA before receiving the secret
            recipient_ids:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs of the recipients
            approver_ids:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs of designated approvers
            approved_by:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  at:
                    type: string
                    format: date-time
              readOnly: true
            rejected_by:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  at:
                    type: string
                    format: date-time
              readOnly: true
            open_uuid:
              type: string
              readOnly: true
              description: Bearer token embedded in the recipient-access URL
            approve_uuid:
              type: string
              readOnly: true
              description: Bearer token embedded in the approver URL

    # --- Common ---
    CustomField:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        type:
          type: string
          description: "Field type (text, password, url, email, date, etc.)"

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
          description: Array of result items
        total:
          type: integer
          description: Total number of items matching the query
        offset:
          type: integer
          description: Number of items skipped
        limit:
          type: integer
          description: Maximum number of items returned

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              description: |
                Machine-readable error code. Normally equals the HTTP status
                code, but MAY carry an application sub-code (>= 1000) that
                conveys a finer reason while the HTTP status remains the
                authority for the response class. Currently the only such
                sub-code is `4031` (`PD_ERRCODE_INVALID_SECOND_PASS` --
                wrong or missing second password) returned with HTTP `403`.
                Match the numeric code, never the localized message.
            message:
              type: string
              description: Human-readable error message

    # -------------------------------------------------------------------------
    # Self-Service (/me/...)
    # -------------------------------------------------------------------------
    ProfileUpdateRequest:
      type: object
      description: |
        Partial update. Send only the fields you want to change. Unknown
        fields are rejected with 400.
      properties:
        display_name:
          type: string
          description: Friendly name ("FullName" internally)
        department:
          type: string
        phone:
          type: string

    PasswordChangeRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          description: The caller's current password (must match the stored hash)
        new_password:
          type: string
          description: The new password; must satisfy the server's password policy

    # -------------------------------------------------------------------------
    # Passkeys / WebAuthn
    # -------------------------------------------------------------------------
    CredentialBasic:
      type: object
      description: |
        Registered WebAuthn credential (passkey) as returned in lists
        (`GET /me/passkeys`, `GET /admin/users/{user_id}/passkeys`) and
        embedded inside `User.passkeys`. Output of the server's
        `SaveCredentialToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          description: Server-issued credential identifier
          readOnly: true
        name:
          type: string
          description: Friendly name; editable via `PATCH /me/passkeys/{id}`
        transports:
          type: array
          items:
            type: string
            enum:
              - usb
              - nfc
              - ble
              - internal
              - hybrid
          description: Authenticator transports supported by this credential
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true

    Credential:
      description: |
        Full WebAuthn credential representation. Extends `CredentialBasic`
        with the technical fields that are only useful in detail views.
      allOf:
        - $ref: "#/components/schemas/CredentialBasic"
        - type: object
          properties:
            type:
              type: string
              description: Credential type (typically "public-key")
              readOnly: true
            alg:
              type: integer
              description: COSE algorithm identifier (e.g., -7 = ES256, -257 = RS256)
              readOnly: true
            sign_count:
              type: integer
              description: Authenticator signature counter (monotonic)
              readOnly: true

    WebAuthnRegistrationBeginResponse:
      type: object
      description: |
        Passes through the W3C `PublicKeyCredentialCreationOptions`
        structure plus a server-issued `session_id` used to correlate the
        subsequent `/me/passkeys/complete` call.
      properties:
        session_id:
          type: string
          description: Opaque session identifier (short-lived, single-use)
        publicKey:
          type: object
          description: W3C PublicKeyCredentialCreationOptions (JSON form)
          additionalProperties: true

    WebAuthnRegistrationCompleteRequest:
      type: object
      description: |
        Authenticator attestation response (as produced by
        `navigator.credentials.create(...)`), plus `session_id` from the
        preceding `/me/passkeys/begin` call.
      required:
        - session_id
      properties:
        session_id:
          type: string
        id:
          type: string
          description: Base64url-encoded credential ID
        rawId:
          type: string
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          description: Authenticator attestation response
          additionalProperties: true
        name:
          type: string
          description: Optional friendly name for the new credential

    WebAuthnAssertionBeginRequest:
      type: object
      required:
        - user
      properties:
        user:
          type: string
          description: Username
        scope:
          type: string
          enum:
            - client
            - admin
          default: client

    WebAuthnAssertionBeginResponse:
      type: object
      properties:
        session_id:
          type: string
        publicKey:
          type: object
          description: W3C PublicKeyCredentialRequestOptions (JSON form)
          additionalProperties: true

    WebAuthnAssertionCompleteRequest:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          additionalProperties: true

    # -------------------------------------------------------------------------
    # API tokens (issued by Server Manager; read-only surface for now)
    # -------------------------------------------------------------------------
    ApiToken:
      type: object
      description: |
        Long-lived API token descriptor. Emitted when listing tokens in
        the Server Manager. The token material itself (`access_token`)
        is returned only once at creation time and never again.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier; also used as the JWT `jti` claim
          readOnly: true
        name:
          type: string
          description: Friendly name (e.g. "CI pipeline")
        user_id:
          type: string
          format: uuid
          description: Owning user
        admin_scope:
          type: boolean
          description: If true, the token authorizes admin-scope requests
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
        lastused_at:
          type: string
          format: date-time
          readOnly: true
        revoked:
          type: boolean

    # -------------------------------------------------------------------------
    # Compact user / group directory
    # -------------------------------------------------------------------------
    UserCompact:
      type: object
      description: |
        Compact user record returned by the client-scope directory
        (`GET /users`, `GET /users/{id}`). Output of the server's
        `SaveUserToJSONCompact`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        display_name:
          type: string
        department:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true

    GroupCompact:
      type: object
      description: |
        Compact group record returned by the client-scope directory
        (`GET /groups`, `GET /groups/{id}`). Output of the server's
        `SaveGroupToJSONCompact`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        department:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # -------------------------------------------------------------------------
    # Folder/entry children list
    # -------------------------------------------------------------------------
    ChildrenList:
      type: object
      description: |
        Paginated list of a folder's (or the database root's) direct
        children. `data` contains a heterogeneous mix of folders and
        entries in their basic (list) representation, distinguished by
        the `type` field. `path` is the ancestor breadcrumb trail from the
        database root down to (but not including) the current folder; it is
        an empty array at the root. The envelope contains only `path`,
        `data`, `total`, `offset`, and `limit` -- there are no top-level
        `name`, `parent`, or `has_second_pass` fields.
      properties:
        path:
          type: array
          readOnly: true
          description: Ancestor breadcrumb trail (root-first); empty at the root.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        data:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/FolderBasic"
              - $ref: "#/components/schemas/Entry"
            discriminator:
              propertyName: type
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
