          description: |
            Refused. `error.code` gives the reason: `403` -- the session is
            not admin-scoped, the account has neither the `server_admin` nor
            the `user_admin` role, or it may not set the requested `roles` or
            `member_of`; `4032` (`PD_ERRCODE_LICENSE_LIMIT`) -- the server's
            licensed number of users is reached (Server 20.0.0 and later).
