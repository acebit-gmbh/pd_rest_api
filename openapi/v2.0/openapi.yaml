    get:
      operationId: adminListSecrets
      tags:
        - Admin - Secrets
      summary: List all secrets (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of secrets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SecretBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: adminCreateSecret
      tags:
        - Admin - Secrets
      summary: Create a new secret (admin)
      description: Requires an admin-scoped session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Secret"
      responses:
        "201":
          description: Secret created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/secrets/{id}:
    get:
      operationId: adminGetSecret
      tags:
        - Admin - Secrets
      summary: Get a secret by ID (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminUpdateSecret
      tags:
        - Admin - Secrets
      summary: Update a secret (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Secret"
      responses:
        "200":
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: adminDeleteSecret
      tags:
        - Admin - Secrets
      summary: Delete a secret (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "204":
          description: Secret deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Self-Service (/me/...)
  # ---------------------------------------------------------------------------
  /me:
    get:
      operationId: getMyProfile
      tags:
        - Self-Service
      summary: Get the current user's own profile (full representation)
      responses:
        "200":
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMyProfile
      tags:
        - Self-Service
      summary: Update the caller's own profile
      description: |
        Strict allow-list. Only `display_name`, `department`, and `phone`
        may be changed via this endpoint. Any other field in the request
        body returns `400`. Use `/me/password` to change the password and
        `/me/passkeys/...` to manage passkeys. Email, roles, groups,
        AD binding, and 2FA settings remain admin-only via
        `PATCH /admin/users/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    post:
      operationId: changeMyPassword
      tags:
        - Self-Service
      summary: Change the caller's own password
      description: |
        Requires knowledge of the current password. Only users with
        `standard` auth mode can change their password here. The built-in
        super-administrator account cannot use this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Password change refused. The user account is flagged as
            "cannot change password", is a super-administrator, or the
            supplied current password does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User does not use standard authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/passkeys:
    get:
      operationId: listMyPasskeys
      tags:
        - Self-Service
      summary: List the caller's registered passkeys (compact representation)
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of passkeys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CredentialBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/passkeys/begin:
    post:
      operationId: beginPasskeyRegistration
      tags:
        - Self-Service
      summary: Begin registering a new passkey for the caller
      description: |
        Returns a WebAuthn registration challenge and a `session_id` that
        must be sent back to `/me/passkeys/complete` together with the
        attestation produced by `navigator.credentials.create(...)`.
      responses:
        "200":
          description: Registration challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnRegistrationBeginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/passkeys/complete:
    post:
      operationId: completePasskeyRegistration
      tags:
        - Self-Service
      summary: Complete passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegistrationCompleteRequest"
      responses:
        "201":
          description: Passkey registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/passkeys/{id}:
    parameters:
      - $ref: "#/components/parameters/PasskeyId"
    patch:
      operationId: renameMyPasskey
      tags:
        - Self-Service
      summary: Rename a registered passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: New friendly name for the passkey
      responses:
        "200":
          description: Passkey renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMyPasskey
      tags:
        - Self-Service
      summary: Delete (revoke) a registered passkey
      responses:
        "204":
          description: Passkey deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # WebAuthn login flow (no token required)
  # ---------------------------------------------------------------------------
  /auth/webauthn/begin:
    post:
      operationId: beginWebAuthnAuth
      tags:
        - Authentication
      summary: Begin WebAuthn authentication (assertion) for a user
      security: []
      description: |
        Returns a WebAuthn assertion challenge and a `session_id`. The
        client runs `navigator.credentials.get(...)` with the returned
        options and posts the assertion back to `/auth/webauthn/complete`.

        For user-enumeration resistance, the server returns the same
        generic 401 response for unknown users, disabled accounts,
        WebAuthn-not-enabled users, and users with no registered
        passkeys. The real reason is recorded only in the server log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertionBeginRequest"
      responses:
        "200":
          description: Assertion challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnAssertionBeginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/webauthn/complete:
    post:
      operationId: completeWebAuthnAuth
      tags:
        - Authentication
      summary: Complete WebAuthn authentication
      security: []
      description: |
        Submit the signed assertion produced by the authenticator. On
        success returns the same `access_token` shape as `/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertionCompleteRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Client-scope user and group directory (read-only, compact representation)
  # ---------------------------------------------------------------------------
  /users:
    get:
      operationId: listUsersDirectory
      tags:
        - Users (directory)
      summary: List all users (compact)
      description: |
        Read-only directory available to every authenticated caller. Used by
        clients to pick users for sharing, permission assignment, and secret
        recipients. Returns a paginated list of compact user records.
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserCompact"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUserDirectory
      tags:
        - Users (directory)
      summary: Get a user by ID (compact)
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCompact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups:
    get:
      operationId: listGroupsDirectory
      tags:
        - Groups (directory)
      summary: List all groups (compact)
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/GroupCompact"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroupDirectory
      tags:
        - Groups (directory)
      summary: Get a group by ID (compact)
      responses:
        "200":
          description: Group record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupCompact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Client-scope secrets (shared links)
  # ---------------------------------------------------------------------------
  /secrets:
    get:
      operationId: listMySecrets
      tags:
        - Secrets
      summary: List secrets authored by the caller
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of the caller's secrets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SecretBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSecret
      tags:
        - Secrets
      summary: Create a new shared-secret link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Secret"
      responses:
        "201":
          description: Secret created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /secrets/{id}:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    get:
      operationId: getMySecret
      tags:
        - Secrets
      summary: Get a secret (full representation)
      responses:
        "200":
          description: Secret details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMySecret
      tags:
        - Secrets
      summary: Delete a secret (author only)
      responses:
        "204":
          description: Secret deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /secrets/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: approveSecret
      tags:
        - Secrets
      summary: Approve a pending secret (designated approver only)
      description: |
        Available to callers listed in the secret's `approver_ids`. The
        action is tallied against the configured quorum; once the quorum
        is reached the secret moves to status `approved`.
      responses:
        "204":
          description: Approval recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /secrets/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: rejectSecret
      tags:
        - Secrets
      summary: Reject a pending secret (designated approver only)
      responses:
        "204":
          description: Rejection recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /secrets/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: revokeSecret
      tags:
        - Secrets
      summary: Revoke a secret (author or admin)
      responses:
        "204":
          description: Secret revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Admin-scope secret sub-commands
  # ---------------------------------------------------------------------------
  /admin/secrets/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: adminApproveSecret
      tags:
        - Admin - Secrets
      summary: Approve a pending secret (admin)
      responses:
        "204":
          description: Approval recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/secrets/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: adminRejectSecret
      tags:
        - Admin - Secrets
      summary: Reject a pending secret (admin)
      responses:
        "204":
          description: Rejection recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/secrets/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    post:
      operationId: adminRevokeSecret
      tags:
        - Admin - Secrets
      summary: Revoke a secret (admin)
      responses:
        "204":
          description: Secret revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Admin user sub-resources
  # ---------------------------------------------------------------------------
  /admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: adminSetUserPassword
      tags:
        - Admin - Users
      summary: Set a user's password (admin)
      description: |
        Admin password reset. Unlike `/me/password`, this does not require
        the user's current password. Not allowed for the super-administrator
        account -- that must be changed via the Password Depot Server Manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  description: New password for the user
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User does not use standard authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{user_id}/passkeys:
    parameters:
      - $ref: "#/components/parameters/UserIdPath"
    get:
      operationId: adminListUserPasskeys
      tags:
        - Admin - Passkeys
      summary: List a user's registered passkeys (admin)
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of the user's passkeys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CredentialBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{user_id}/passkeys/{id}:
    parameters:
      - $ref: "#/components/parameters/UserIdPath"
      - $ref: "#/components/parameters/PasskeyId"
    delete:
      operationId: adminRevokeUserPasskey
      tags:
        - Admin - Passkeys
      summary: Revoke a user's passkey (admin)
      description: |
        Admins cannot register passkeys on behalf of a user (requires the
        user's authenticator); only deletion is exposed.
      responses:
        "204":
          description: Passkey revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Database sub-resources (document content, folder navigation)
  # ---------------------------------------------------------------------------
  /databases/{db}/children:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
    get:
      operationId: listDatabaseRootChildren
      tags:
        - Databases
      summary: List root-level folders and entries of a database
      description: |
        Returns the direct children of the database root: top-level folders
        and top-level entries, merged in a single paginated list.
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildrenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/folders/{folder_id}/children:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - $ref: "#/components/parameters/FolderIdPath"
    get:
      operationId: listFolderChildren
      tags:
        - Folders
      summary: List the folders and entries directly inside a folder
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildrenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/folders/{folder_id}/move:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - $ref: "#/components/parameters/FolderIdPath"
    post:
      operationId: moveFolder
      tags:
        - Folders
      summary: Move a folder to a different parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveEntryRequest"
      responses:
        "200":
          description: Folder moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/entries/{entry_id}/content:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - $ref: "#/components/parameters/EntryIdPath"
    get:
      operationId: downloadDocumentContent
      tags:
        - Entries
      summary: Download the binary content of a document entry
      description: |
        The entry must be of type `document`. Response is the raw file
        bytes. The `Content-Disposition` header carries the stored
        filename (sanitized per RFC 7230 quoted-string rules) and
        `Content-Type` is derived from the filename extension.
      responses:
        "200":
          description: Document content
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Form: `attachment; filename="<sanitized-name>"`'
              example: 'attachment; filename="report.pdf"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Entry is not of type `document`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Entry not found, or no content has been uploaded yet for this
            document entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: uploadDocumentContent
      tags:
        - Entries
      summary: Upload (or replace) the binary content of a document entry
      description: |
        Body is the raw file bytes, maximum 64 MB. The `Content-Disposition`
        header on the request (if present) sets the stored filename:
        `Content-Disposition: attachment; filename="report.pdf"`. CR/LF and
        other control characters are stripped from the stored name.
      parameters:
        - name: Content-Disposition
          in: header
          required: false
          schema:
            type: string
          description: 'Optional stored filename, e.g. `attachment; filename="report.pdf"`'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Upload succeeded; updated entry returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Entry is not of type `document`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /databases/{db}/entries/{entry_id}/otp:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - $ref: "#/components/parameters/EntryIdPath"
    get:
      operationId: getEntryOneTimeCode
      tags:
        - Entries
      summary: Get the entry's current one-time code (TOTP)
      description: |
        Returns the current one-time code, computed on the server's clock from
        the TOTP settings stored with the entry. The same rules apply as for
        `getEntry`: read permission, no seal for the caller, and
        `X-Second-Password` for a protected entry (for a link, also for the
        entry it points to). For a link the code comes from the link's own TOTP
        settings. Long-lived API tokens are refused. The seed is never
        returned. Every call is audited as an entry access.
      parameters:
        - $ref: "#/components/parameters/SecondPasswordHeader"
      responses:
        "200":
          description: The current one-time code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimeCode"
        "400":
          description: "`X-Second-Password` longer than 1024 characters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `error.code` 4031: wrong or missing second password.
            `error.code` 403: no permission (on the entry or a link's target),
            sealed, long-lived API token, or an old form of second-password
            protection the REST API cannot check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            `error.code` 4041: the entry has no one-time code.
            `error.code` 404: database or entry not found, or the entry is in
            the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          description: Entry type `encrypted_file` or `certificate`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Database icons (Server 20.0.0 and later)
  # ---------------------------------------------------------------------------
  /databases/{db}/icons:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
    get:
      operationId: listDatabaseIcons
      tags:
        - Icons
      summary: List the icons of a database, or fetch several images in one call
      description: |
        Server 20.0.0 and later; detect support by the `icons` object on the
        database (`DatabaseIconsCapability`), never by calling this route --
        an older server answers a plain `404`.

        Without `ids`: a paginated list of the database's icons WITHOUT image
        data (`id`, `name`, `version`), ordered by position. With `ids` and
        `include=data`: up to `batch_max` (32) icons with `state` and, for
        `state` `ok`, the image fields. `include=data` requires `ids`; there
        is no paged listing of images.

        Removed icons and icons without image data are never listed and do
        not count in `total`. A requested id that is unknown, removed or
        empty is silently left out: treat a requested id that does not come
        back as gone. Images are added while the decoded image bytes of the
        response stay within 2 MiB; later items carry `state` `deferred` and
        are fetched with `getDatabaseIcon`. Icons uploaded over REST are
        never deferred.

        Needs nothing beyond access to the database: client scope the
        database-level `use` right, admin scope management of the database;
        otherwise a plain `404`. Works on a mirror server. Responses are
        `no-store`; cache images by (database, `id`, `version`).
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
        - name: ids
          in: query
          required: false
          description: |
            Comma-separated icon ids, 1 to 32 (`batch_max`), each 1 to 6
            decimal digits; duplicates are collapsed. `offset` and `limit`
            are ignored when `ids` is given. More than 32 ids, or a
            malformed value, answers `400`.
          schema:
            type: string
            pattern: "^[0-9]{1,6}(,[0-9]{1,6}){0,31}$"
          example: "3,7"
        - name: include
          in: query
          required: false
          description: "`data` adds `state` and the image fields to every item. Requires `ids`."
          schema:
            type: string
            enum:
              - data
      responses:
        "200":
          description: Icons of the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseIconList"
        "400":
          description: |
            Bad `offset`, `limit` or `ids`, more than `batch_max` ids, an
            `include` other than `data`, or `include=data` without `ids`
            (`error.code` 400).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Database not found or not accessible to the caller; also the
            answer of a server older than 20.0.0 (`error.code` 404).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      operationId: uploadDatabaseIcon
      tags:
        - Icons
      summary: Upload a new icon
      description: |
        Server 20.0.0 and later. Stores a new icon in the database's icon
        collection -- the one the Windows client uses. The request is JSON;
        the image travels as Base64 in `data`. PNG only (detected by
        signature, never by a declared type), 1 to `max_side` (64) pixels per
        side, 67 to `max_bytes` (32768) bytes decoded; 64x64 is the native
        size of a Password Depot icon and what first-party clients always
        send. JPEG, GIF, BMP, ICO, WebP, SVG and animated PNG are refused.
        The request body may be at most 65536 bytes.

        The server keeps only the chunks `IHDR`, `PLTE`, `tRNS`, `IDAT` and
        `IEND`, proves that the Windows client's decoder reads the result,
        and builds a 16x16 rendition; the stored image is therefore not
        byte-identical to the upload, and `version` is computed from what
        was stored.

        Name collisions: no icon of that name, or a removed one (brought
        back in place, same `id`) -> `201`, `created` true. An icon of that
        name with exactly the same image -> `200`, `created` false, nothing
        written (retries are safe). An icon of that name with a DIFFERENT
        image is never touched: the upload is stored under a free name such
        as `example.com (2)` -> `201`. The `name` in the response is
        authoritative and is the value for `image_name`. There is no delete
        and no replace.

        Permission: whoever can open the database (published as
        `icons.can_upload`); long-lived API tokens included. A mirror server
        answers a plain `403`. An upload is database-wide: every user of the
        database sees the icon's name and image. Every attempt past the
        permission check is audited, never with image data. A refused or
        failed upload leaves no icon, no half-written icon and no changed
        icon. A connected Windows client sees the icon after it reopens the
        database.

        Order of checks: token (`401`), mirror (`403`), database (`404`),
        method (`405`), upload right (`403`), body (`400`; over 65536 bytes
        `413` / `4131`), `name` (`400`), `data` (`400` / `4008`; too long or
        too many bytes `413` / `4131`), PNG structure (`400` / `4008`; too
        many pixels `413` / `4131`), decoding (`400` / `4008`), then under
        the database lock the collision rule, the quota (`403` / `4034`) and
        the record size (`413` / `4131`). Only then is the icon stored, in
        one step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseIconUpload"
      responses:
        "200":
          description: An identical icon of that name already exists; nothing was written (`created` false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseIconUploadResult"
        "201":
          description: Icon stored (`created` true). `name` may differ from the requested one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseIconUploadResult"
        "400":
          description: |
            `error.code` 400: the body is missing or not a JSON object, or
            `name` is missing, not a string, empty after trimming, too long
            or contains a refused character.
            `error.code` 4008 (`PD_ERRCODE_ICON_IMAGE`): `data` is missing,
            not a string, not strict Base64, shorter than 67 bytes, or not
            a usable, non-animated PNG.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `error.code` 4034 (`PD_ERRCODE_ICON_QUOTA`): a new icon would
            exceed `max_count` slots (removed icons included) or 8 MiB of
            stored icon data in this database.
            `error.code` 403: mirror server, or the caller may not upload to
            this database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: |
            `error.code` 4131 (`PD_ERRCODE_ICON_TOO_LARGE`): body over 65536
            bytes, `data` over 43692 characters or over `max_bytes` decoded,
            width or height over `max_side`, or a stored record over 65535
            bytes. Scale down and retry.
            `error.code` 413: `Content-Length` over 1 MB, refused before the
            body is read (see `PayloadTooLarge`; no CORS headers).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /databases/{db}/icons/{icon_id}:
    parameters:
      - $ref: "#/components/parameters/DatabaseIdPath"
      - name: icon_id
        in: path
        required: true
        description: The icon's `id` -- 1 to 6 decimal digits, valid only inside this database
        schema:
          type: string
          pattern: "^[0-9]{1,6}$"
    get:
      operationId: getDatabaseIcon
      tags:
        - Icons
      summary: Get one icon with its image
      description: |
        Server 20.0.0 and later. Returns the icon with `state` `ok` and the
        image fields. No query parameters and no `X-Second-Password`: icons
        belong to the database, not to an entry. Works on a mirror server.
        Store the image under the `version` this response carries; when it
        differs from the `version` on the entry or folder row, the row is
        stale. The `id` of an icon of another database addresses this
        database's own icon or answers `404` / `4042`, never the other
        database's image.
      responses:
        "200":
          description: The icon with its image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseIcon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            `error.code` 4042 (`PD_ERRCODE_ICON_NOT_FOUND`): no usable icon
            with that id in THIS database -- unknown id, removed icon, no
            image, or a stored image that cannot be served. Show the item's
            standard `icon` and do not ask again in this session.
            `error.code` 404: database not found or not accessible, a server
            older than 20.0.0, an `icon_id` that is not 1 to 6 digits, or a
            further path segment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from POST /auth/login

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------
  parameters:
    DatabaseId:
      name: id
      in: path
      required: true
      description: Database ID
      schema:
        type: string
        format: uuid

    DatabaseIdPath:
      name: db
      in: path
      required: true
      description: Database ID
      schema:
        type: string
        format: uuid

    FolderId:
      name: id
      in: path
      required: true
      description: Folder ID
      schema:
        type: string
        format: uuid

    EntryId:
      name: id
      in: path
      required: true
      description: Entry ID
      schema:
        type: string
        format: uuid

    PermissionId:
      name: id
      in: path
      required: true
      description: Permission ID
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: string
        format: uuid

    GroupId:
      name: id
      in: path
      required: true
      description: Group ID
      schema:
        type: string
        format: uuid

    AlertId:
      name: id
      in: path
      required: true
      description: Alert ID
      schema:
        type: string
        format: uuid

    SecretId:
      name: id
      in: path
      required: true
      description: Secret ID
      schema:
        type: string
        format: uuid

    PasskeyId:
      name: id
      in: path
      required: true
      description: Passkey credential ID (server-issued UUID for the passkey record)
      schema:
        type: string
        format: uuid

    UserIdPath:
      name: user_id
      in: path
      required: true
      description: User ID -- path parameter used by sub-resources under /admin/users/{user_id}
      schema:
        type: string
        format: uuid

    EntryIdPath:
      name: entry_id
      in: path
      required: true
      description: Entry ID -- path parameter used by sub-resources under /databases/{db}/entries/{entry_id}
      schema:
        type: string
        format: uuid

    SecondPasswordHeader:
      name: X-Second-Password
      in: header
      required: false
      description: |
        Base64 of the UTF-8 bytes of the second password. Required when the
        entry - or, for a link, the entry it points to - is protected by a
        second password; otherwise the request is refused with HTTP 403 and
        `error.code` 4031.
      schema:
        type: string

    FolderIdPath:
      name: folder_id
      in: path
      required: true
      description: Folder ID -- path parameter used by sub-resources under /databases/{db}/folders/{folder_id}
      schema:
        type: string
        format: uuid

    PaginationOffset:
      name: offset
      in: query
      required: false
      description: Number of items to skip (for pagination)
      schema:
        type: integer
        minimum: 0
        default: 0

    PaginationLimit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return. Values above the cap are clamped.
        Default: 100. Maximum: 1000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: |
        Malformed request. The request body could not be parsed as JSON, or a
        required field is missing, or an enum value is unknown. The response
        body uses the standard error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 400
              message: "Malformed JSON request body."

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 401
              message: "Invalid or expired access token"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 403
              message: "You do not have permission to perform this action"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 404
              message: "Resource not found"

    MethodNotAllowed:
      description: |
        The HTTP method is not supported for this endpoint. Per RFC 7231 §6.5.5
        the response carries an `Allow` header listing the supported methods.
      headers:
        Allow:
          schema:
            type: string
          description: Comma-separated list of methods supported by the target resource
          example: "GET, POST, PATCH, DELETE"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 405
              message: "Supported methods: GET POST PATCH DELETE"

    PayloadTooLarge:
      description: |
        The request body exceeds the allowed size limit. JSON endpoints cap at
        1 MB; the document-content upload endpoint caps at 64 MB. These caps
        are applied to `Content-Length` before the body is read: the
        response carries `error.code` `413` and no CORS headers, and the
        connection is closed. `uploadDatabaseIcon` additionally answers `413`
        with `error.code` `4131` (`PD_ERRCODE_ICON_TOO_LARGE`) for its own
        limits.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 413
              message: "Request body exceeds the allowed size limit."

    TooManyRequests:
      description: |
        The caller's IP address is temporarily blocked by the server's
        login-attempt throttle. Honor the `Retry-After` header and back off;
        retrying immediately will not shorten the lockout.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the block expires
          example: 1745
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 429
              message: "Your IP address has been blocked. Please contact your PD server administrator or try again later."

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Authentication ---
    LoginRequest:
      type: object
      description: |
        The required fields depend on the `auth` method:
        - `standard` (default): `user`, `pass`
        - `sspi`: `user`, `pass`
        - `negotiate`: (none -- SPNEGO handshake via `WWW-Authenticate`)
        - `azure` (deprecated): `id_token`
        - `oidc`: `idp`, `id_token`
      properties:
        auth:
          type: string
          enum:
            - standard
            - sspi
            - negotiate
            - azure
            - oidc
          default: standard
          description: |
            Authentication method. Defaults to `standard` if omitted.
            - `standard` -- Normal username/password authentication.
            - `sspi` -- SSPI (Kerberos / Negotiate / NTLM) with explicit Windows domain credentials supplied in `user` and `pass`.
            - `negotiate` -- Integrated Windows authentication. No credentials in the body; the server responds with `401 WWW-Authenticate: Negotiate` and the client completes a SPNEGO handshake on the same TCP connection using the caller's current identity.
            - `azure` -- (Deprecated) Azure AD / Entra ID. Use `oidc` instead.
            - `oidc` -- OpenID Connect via a registered identity provider.
        scope:
          type: string
          enum:
            - client
            - admin
          default: client
          description: |
            Session scope. Determines which endpoints are accessible.
            - `client` -- (Default) Normal client session. Access to databases, folders, entries, and search.
            - `admin` -- Server administration session. Access to all client endpoints plus `/admin/` management endpoints (databases CRUD, users, groups, permissions, alerts, secrets).
        user:
          type: string
          description: Username (required for `standard` and `sspi`)
        pass:
          type: string
          description: Password (required for `standard` and `sspi`)
        tfacode:
          type: string
          description: 6-digit two-factor authentication code (if enabled)
        idp:
          type: string
          description: Identity Provider ID from `/auth/oidc` (required for `oidc`)
        id_token:
          type: string
          description: |
            Identity token from the OIDC/Azure flow (required for `oidc` and
            `azure`). Must carry either (a) a signed OIDC `id_token` JWT, or
            (b) an opaque OAuth access token usable as a Bearer credential at
            the provider's `userinfo_endpoint`. It MUST NOT be a bare
            authorization `code`: the REST server performs no
            authorization-code exchange and never POSTs to the
            `token_endpoint`. It validates the supplied value directly (JWT
            signature/aud/exp via JWKS, then falls back to Bearer ->
            userinfo). The recommended client configuration is
            `response_type=id_token`. An invalid/expired/forged token, a bare
            code, or no matching local user yields HTTP `401`.

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Bearer token to use in the Authorization header

    OidcProvider:
      type: object
      properties:
        id:
          type: string
          description: Unique provider identifier
        provider_class:
          type: string
          description: Provider class name
        display_name:
          type: string
          description: Human-readable provider name
        discovery_endpoint:
          type: string
          format: uri
          description: OIDC discovery endpoint URL
        client_id:
          type: string
          description: OAuth 2.0 client ID
        redirect_uri:
          type: string
          format: uri
          description: Redirect URI after authentication
        scope:
          type: string
          description: OAuth 2.0 scopes (space-separated)
        response_type:
          type: string
          description: OAuth 2.0 response type

    # --- Databases ---
    DatabaseBasic:
      type: object
      description: |
        Fields returned for a database in EVERY context: list views
        (`GET /databases`, `GET /admin/databases`), client-scope detail
        views (`GET /databases/{id}`), and when embedded in other
        responses. Output of the server's `SaveDatabaseToJSON` with
        `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Database name (used as part of the storage filename)
        description:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
        icons:
          $ref: "#/components/schemas/DatabaseIconsCapability"

    Database:
      description: |
        Full database representation returned by
        `GET /admin/databases/{id}` for admin-scope callers. Extends
        `DatabaseBasic` with fields that require admin scope.
      allOf:
        - $ref: "#/components/schemas/DatabaseBasic"
        - type: object
          properties:
            size:
              type: integer
              format: int64
              description: On-disk size in bytes
              readOnly: true
            entries_count:
              type: integer
              description: Total number of entries in the database
              readOnly: true
            icons_count:
              type: integer
              description: |
                Number of icon slots in the database's icon collection,
                removed icons included. Not a capability marker and unrelated
                to `icons`; it can exceed the `total` of `listDatabaseIcons`.
              readOnly: true
            disabled:
              type: boolean
            db_admins:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs designated as database administrators
            db_supervisors:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs designated as database supervisors
            include_server_supervisors:
              type: boolean
              description: Whether server-level supervisors can also act on this database

    # --- Database icons ---
    DatabaseIconsCapability:
      type: object
      readOnly: true
      description: |
        Database-icon capability of a database for the current caller
        (Server 20.0.0 and later). Present on EVERY database object -- client
        and admin scope, list and detail. Its presence means the server
        implements database icons as a whole: `listDatabaseIcons`,
        `getDatabaseIcon`, `uploadDatabaseIcon`, `database_icon` on entries
        and folders, validated `image_*` writes, and an `icon` that follows
        `image_index`. Absent on older servers: never call the icon routes,
        never probe by uploading, treat `icon` as the legacy value.
      required:
        - can_upload
        - accepted_types
        - max_bytes
        - max_side
        - max_count
        - batch_max
      properties:
        can_upload:
          type: boolean
          description: |
            Whether the caller can upload an icon to this database right now:
            not a mirror server, the caller holds the upload right (everyone
            who can open the database does), and the database has fewer than
            `max_count` icon slots. An upload can still answer `403` / `4034`.
        accepted_types:
          type: array
          items:
            type: string
          description: Image types an upload accepts
          example: ["image/png"]
        max_bytes:
          type: integer
          description: Largest accepted image in bytes, after Base64 decoding
          example: 32768
        max_side:
          type: integer
          description: Largest accepted width and height in pixels
          example: 64
        max_count:
          type: integer
          description: Largest number of icon slots per database, removed icons included
          example: 1024
        batch_max:
          type: integer
          description: Largest number of ids in one `listDatabaseIcons` call
          example: 32

    DatabaseIconRef:
      type: object
      nullable: true
      readOnly: true
      description: |
        The database icon an entry or folder uses, in the item's OWN
        database, or `null` (Server 20.0.0 and later; the key is always
        present there and absent on older servers). `null` when
        `image_custom` is false, and when `image_name` names no icon that
        exists with an image. An item with `image_custom` true and an empty
        `image_name` (last saved by a client older than version 17) is
        resolved by its stored position. Carries no image data: fetch it with
        `listDatabaseIcons` (`ids`, `include=data`) or `getDatabaseIcon` and
        cache it by `version`. Fallback chain for clients: this image, then
        the standard icon named by `icon`, then the client's own symbol.
      required:
        - id
        - name
        - version
      properties:
        id:
          type: string
          pattern: "^[0-9]{1,6}$"
          description: Fetch handle (decimal digits), valid only inside this database
          example: "3"
        name:
          type: string
          description: The icon's identifier; the value stored in `image_name`
          example: example.com
        version:
          type: string
          description: Opaque change token of the stored image
          example: 9c1e5f2a-10f4-2b1

    DatabaseIcon:
      type: object
      description: |
        An icon stored in a database. `name` is THE identifier (unique per
        database, compared case-insensitively) and the value for
        `image_name`. `id` is an opaque fetch handle of decimal digits, valid
        only inside this database -- not a UUID -- and may be reassigned
        after an administrator removed all icons, so it always travels with
        `version`. `version` changes whenever the stored image changes.
        `max_side` and `max_bytes` limit uploads only: icons stored by the
        desktop clients are served in their stored size, up to 512 pixels per side
        and 1 MiB of image data; beyond that the icon is `unusable`.
      required:
        - id
        - name
        - version
      properties:
        id:
          type: string
          pattern: "^[0-9]{1,6}$"
          example: "3"
        name:
          type: string
          example: example.com
        version:
          type: string
          example: 9c1e5f2a-10f4-2b1
        state:
          type: string
          enum:
            - ok
            - unusable
            - deferred
          description: |
            Present on `getDatabaseIcon` and on `listDatabaseIcons` with
            `include=data`. `ok`: the image fields follow. `unusable`: the
            stored image cannot be served -- show the fallback and remember
            that for this `id` and `version`. `deferred`: the response's
            byte budget was reached -- fetch with `getDatabaseIcon`. Treat an
            unknown value as `unusable`.
        content_type:
          type: string
          enum:
            - image/png
            - image/bmp
          description: Only with `state` `ok`. `image/bmp` for icons an older client stored. Accept exactly these two
        width:
          type: integer
          description: Pixels, from the image header (only with `state` `ok`); 1 to 512, so it can exceed `max_side`
        height:
          type: integer
          description: Pixels, from the image header (only with `state` `ok`); 1 to 512, so it can exceed `max_side`
        data:
          type: string
          format: byte
          description: |
            The image as Base64 (RFC 4648, standard alphabet, no line
            breaks, no `data:` prefix). Only with `state` `ok`.

    DatabaseIconList:
      allOf:
        - $ref: "#/components/schemas/PaginatedResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/DatabaseIcon"

    DatabaseIconUpload:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Name of the icon. Trimmed by the server; then 1 to 100 characters
            and at most 240 bytes in UTF-8. Refused: U+0000 to U+001F,
            U+007F to U+009F, U+FFFE, U+FFFF and unpaired surrogates. Dots,
            spaces, parentheses, `&`, `/` and non-ASCII letters are legal.
          example: example.com
        data:
          type: string
          format: byte
          maxLength: 43692
          description: |
            The PNG as strict Base64 (no line breaks, no `data:` prefix), at
            most 43692 characters; 67 to 32768 bytes decoded; 1 to 64 pixels
            per side. First-party clients always send 64x64.

    DatabaseIconUploadResult:
      type: object
      required:
        - id
        - name
        - version
        - created
      properties:
        id:
          type: string
          pattern: "^[0-9]{1,6}$"
          example: "7"
        name:
          type: string
          description: The name the icon is stored under -- authoritative; may be `<requested name> (2)`
          example: example.com
        version:
          type: string
          example: 9c1e5f2a-10f4-2b1
        created:
          type: boolean
          description: |
            true (`201`): a new icon was stored, or a removed icon of that
            name was brought back. false (`200`): an identical icon of that
            name already existed and nothing was written.

    # --- Folders ---
    FolderBasic:
      type: object
      description: |
        Fields returned for a folder in EVERY context -- list views and
        detail views. Folders and entries share a `type` discriminator
        so they can be returned together in the `/children` listings;
        `FolderBasic`/`Folder` objects always carry `"type": "folder"`.
        Output of the server's `SaveFolderToJSON` with
        `AFullRepresentation=False`.
      properties:
        type:
          type: string
          enum:
            - folder
          description: Discriminator distinguishing folders from entries in heterogeneous listings
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Folder display name
        icon:
          type: string
          description: |
            File name of a standard icon, always `ico0.svg` to `ico134.svg`
            (served without authentication at `/file/{icon}`, outside
            `/v2.0`): `ico<image_index>.svg` when `image_custom` is false and
            `image_index` is 0 to 134, otherwise the standard folder icon
            `ico3.svg`. With a `database_icon` it is `ico3.svg` and serves as
            the fallback. Servers older than 20.0.0 ignored `image_index`
            here and could return `<image_name>.ico`.
          readOnly: true
        database_icon:
          $ref: "#/components/schemas/DatabaseIconRef"
        importance:
          type: string
          description: Importance level ("low", "normal" or "high"), the same level the Windows, macOS, iOS and Android clients show; any other string is stored as "normal"
        category:
          type: string
        tags:
          type: string
          description: Comma-separated tag list
        has_second_pass:
          type: boolean
          description: Whether this folder is protected by a second password
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Folder:
      description: |
        Full folder representation returned by detail endpoints. Extends
        `FolderBasic` with fields that are omitted from list responses.
      allOf:
        - $ref: "#/components/schemas/FolderBasic"
        - type: object
          properties:
            author:
              type: string
              format: uuid
              readOnly: true
              description: ID of the user who originally created the folder
            image_custom:
              type: boolean
              description: true when the folder uses a database icon (`image_name`), false when it uses a standard icon (`image_index`)
            image_index:
              type: integer
              description: |
                With `image_custom` false: the number of the standard icon, 0
                to 134 (write -1 for the standard folder icon). With
                `image_custom` true: a position the server maintains for the
                desktop clients; ignore it when reading, it is ignored when
                written.
            image_name:
              type: string
              description: |
                With `image_custom` true: the `name` of an icon stored in
                this database (see `listDatabaseIcons`), e.g. "example.com"
                -- not a file name. Empty otherwise.
            comments:
              type: string

    # --- Entries ---
    Entry:
      type: object
      description: |
        A credential entry. The `type` field discriminates between the
        different kinds of entries; type-specific fields are carried in a
        sub-object named after the type (e.g. `credit_card`, `license`,
        `identity`, `information`, `banking`, `document`, `rdp`, `putty`,
        `teamviewer`, `passkey`). For `password` and `custom` entries the
        common password fields (`pass`, `urls`, `custom_fields`, ...) are
        at the top level instead.
      properties:
        type:
          type: string
          enum:
            - password
            - custom
            - credit_card
            - license
            - identity
            - information
            - banking
            - document
            - rdp
            - putty
            - teamviewer
            - passkey
          description: Entry kind (discriminator)
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        url:
          type: string
          description: Primary URL (empty for types that don't have one)
        login:
          type: string
          description: Primary username / login
        has_second_pass:
          type: boolean
          description: Whether this entry is protected by a second password
          readOnly: true
        has_otp:
          type: boolean
          description: |
            Whether a one-time code (TOTP) can be generated for this entry
            (see getEntryOneTimeCode). For a link, from the link's own TOTP
            settings. False when the caller may not read the entry. Absent on
            servers older than 20.0.0.
          readOnly: true
        totp:
          description: |
            One-time-code (TOTP) settings. In every response this is the
            read form `EntryTotp`: always present on an entry (never on a
            folder), always an object, never null, never withheld; compact
            representations carry `state` only. In a `createEntry` or
            `updateEntry` request body it is the write form `EntryTotpWrite`,
            or `null` (`updateEntry`: remove the seed; `createEntry`: no
            effect). The seed is never part of any response. Absent on
            servers older than 20.0.0; its presence tells a client that the
            server accepts the write form, because unknown request keys are
            ignored silently.
          oneOf:
            - $ref: "#/components/schemas/EntryTotp"
            - $ref: "#/components/schemas/EntryTotpWrite"
        icon:
          type: string
          description: |
            File name of a standard icon, always `ico0.svg` to `ico134.svg`
            (served without authentication at `/file/{icon}`, outside
            `/v2.0`): `ico<image_index>.svg` when `image_custom` is false and
            `image_index` is 0 to 134, otherwise the standard icon of the
            entry's type (password and custom 0, rdp 123, teamviewer 124,
            putty 125, credit_card 126, banking 127, license 128, identity
            129, information 131, document 133, passkey 134). With a
            `database_icon` it is the type's icon and serves as the fallback.
            Servers older than 20.0.0 ignored `image_index` here, could
            return `<image_name>.ico`, and reported 132 for documents.
          readOnly: true
        database_icon:
          $ref: "#/components/schemas/DatabaseIconRef"
        importance:
          type: string
          description: Importance level ("low", "normal" or "high"), the same level the Windows, macOS, iOS and Android clients show; any other string is stored as "normal"
        category:
          type: string
        tags:
          type: string
          description: Comma-separated tag list
        updated_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        # Full representation only (for type = password / custom)
        login_id:
          type: string
          description: Associated HTML element id or name for the login field
        pass:
          type: string
          description: Main password (only for `password` / `custom`)
        pass_id:
          type: string
          description: Associated HTML element id or name for the password field
        urls:
          type: array
          items:
            type: string
          description: Additional URLs associated with this entry
        is_link:
          type: boolean
        linked_item:
          type: string
          format: uuid
          nullable: true
          description: ID of the template entry this one links to (when `is_link` is true)
        is_template:
          type: boolean
        info_template:
          type: string
          nullable: true
          description: Template reference (only for `custom` entries)
        param_str:
          type: string
          description: Command-line parameters
        custom_fields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
          description: Additional name/value/type tuples (only for `password` / `custom`)
        author:
          type: string
          format: uuid
          readOnly: true
        image_custom:
          type: boolean
          description: true when the entry uses a database icon (`image_name`), false when it uses a standard icon (`image_index`). Full representation only
        image_index:
          type: integer
          description: |
            With `image_custom` false: the number of the standard icon, 0 to
            134 (write -1 for the standard icon of the entry's type). With
            `image_custom` true: a position the server maintains for the
            desktop clients; ignore it when reading, it is ignored when
            written. Full representation only.
        image_name:
          type: string
          description: |
            With `image_custom` true: the `name` of an icon stored in this
            database (see `listDatabaseIcons`, `uploadDatabaseIcon`), e.g.
            "example.com" -- not a file name. Empty otherwise. Full
            representation only.
        comments:
          type: string
        # Type-specific sub-objects. Only one of these is present per entry,
        # keyed by the `type` field above.
        credit_card:
          $ref: "#/components/schemas/EntryCreditCard"
        license:
          $ref: "#/components/schemas/EntryLicense"
        identity:
          $ref: "#/components/schemas/EntryIdentity"
        information:
          $ref: "#/components/schemas/EntryInformation"
        banking:
          $ref: "#/components/schemas/EntryBanking"
        document:
          $ref: "#/components/schemas/EntryDocument"
        rdp:
          $ref: "#/components/schemas/EntryRdp"
        putty:
          $ref: "#/components/schemas/EntryPutty"
        teamviewer:
          $ref: "#/components/schemas/EntryTeamViewer"
        passkey:
          $ref: "#/components/schemas/EntryPasskey"

    EntryCreditCard:
      type: object
      properties:
        card:
          type: string
          description: Card brand (e.g. "master_card", "visa", "discover")
        holder:
          type: string
        number:
          type: string
          description: 16-digit card number, space-separated
        valid_thru:
          type: string
          description: Expiry date in MM/YYYY form
        cvv:
          type: string
        phone:
          type: string
          description: Hotline telephone
        url:
          type: string
        online_user:
          type: string
        online_pass:
          type: string
        pin:
          type: string

    EntryLicense:
      type: object
      properties:
        product:
          type: string
        version:
          type: string
        reg_name:
          type: string
        key_1:
          type: string
        key_2:
          type: string
        url:
          type: string
        user:
          type: string
        pass:
          type: string
        purchase_date:
          type: string
          format: date
          nullable: true
        order_number:
          type: string
        reg_email:
          type: string

    EntryIdentity:
      type: object
      properties:
        account:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        company:
          type: string
        address_1:
          type: string
        address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
        phone:
          type: string
        website:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        mobile:
          type: string
        fax:
          type: string
        house:
          type: string

    EntryInformation:
      type: object
      properties:
        text:
          type: string

    EntryBanking:
      type: object
      description: Online banking entry (previously `ec_card`, renamed in v2.0)
      properties:
        url:
          type: string
        user:
          type: string
        pass:
          type: string
        holder:
          type: string
        account_number:
          type: string
          description: Legacy field -- preserved for migration from older DB formats
        bank_id:
          type: string
          description: Legacy field
        bank_name:
          type: string
        bic:
          type: string
        iban:
          type: string
        card_number:
          type: string
        phone:
          type: string
        legitimation_id:
          type: string
          description: Legitimation ID (used by some German banks)
        pin:
          type: string

    EntryDocument:
      type: object
      description: |
        Metadata for a document-type entry. Use
        `GET /databases/{db}/entries/{entry_id}/content` to fetch the
        actual binary content.
      properties:
        name:
          type: string
          description: Filename (as set via Content-Disposition on upload)
        type:
          type: string
          description: MIME type derived from the filename extension
        size:
          type: integer
          format: int64
          description: Content size in bytes

    EntryRdp:
      type: object
      properties:
        host:
          type: string
        user:
          type: string
        pass:
          type: string
        cmd_line:
          type: string

    EntryPutty:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
          description: Connection protocol (ssh, telnet, rlogin, ...)
        user:
          type: string
        pass:
          type: string
        key_file:
          type: string
        key_pass:
          type: string
        cmd_line:
          type: string

    EntryTeamViewer:
      type: object
      properties:
        partner_id:
          type: string
        pass:
          type: string
        mode:
          type: string
          description: TeamViewer mode

    EntryPasskey:
      type: object
      properties:
        url:
          type: string
        user:
          type: string
        alg:
          type: integer
          description: COSE algorithm ID
        sign_count:
          type: integer
          readOnly: true
        cred_id:
          type: string
        rp_id:
          type: string
        rp_name:
          type: string
        user_id:
          type: string
        key:
          type: string
          description: Public and private key material (encrypted at rest)

    MoveEntryRequest:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          format: uuid
          description: Target folder ID to move the entry into

    OneTimeCode:
      type: object
      required:
        - code
        - digits
        - period
        - expires_in
        - algorithm
      properties:
        code:
          type: string
          pattern: "^[0-9]+$"
          description: The current code. A string, because leading zeros are part of it.
          example: "012345"
        digits:
          type: integer
          minimum: 4
          maximum: 16
          description: |
            Length of the code. Codes of 10 or more digits are Password
            Depot's own and not RFC 4226 codes; every Password Depot client
            computes them the same way.
          example: 6
        period:
          type: integer
          minimum: 1
          description: Seconds each code is valid.
          example: 30
        expires_in:
          type: integer
          minimum: 1
          description: |
            Whole seconds until the code changes, 1 to period; the time
            actually left is between expires_in - 1 and expires_in seconds.
          example: 12
        algorithm:
          type: string
          enum: [SHA1, SHA256, SHA512]
          example: SHA1

    EntryTotp:
      type: object
      description: |
        Read form of an entry's `totp` key (Server 20.0.0 and later). Present
        on every entry representation, compact and full; always an object,
        never null, never withheld. The compact form carries `state` only.
        The full form adds `writable` and, when `state` is `set` or
        `invalid`, the stored `digits`, `period`, `algorithm` and
        `conforming`, echoed as stored so that a repair UI can show them.
        For `hidden`, only `state` is present. The seed is never a field.
      required:
        - state
      properties:
        state:
          type: string
          enum: [none, set, invalid, unsupported, hidden]
          readOnly: true
          description: |
            In order of precedence: `hidden` (the caller may not read the
            entry; nothing else is reported), `unsupported` (entry type
            `encrypted_file` or `certificate`), `set` (a code can be
            computed; the same as `has_otp: true`), `invalid` (a seed is
            stored but produces no code), `none` (no seed). Treat a value you
            do not recognise conservatively, as `hidden`: show no code and
            offer no editor.
          example: set
        writable:
          type: boolean
          readOnly: true
          description: |
            Full representation only. Whether the entry's type accepts the
            write form: `password`, `credit_card`, `license`, `banking`,
            `custom`.
          example: true
        digits:
          type: integer
          readOnly: true
          description: |
            Full representation, `state` set or invalid. The stored code
            length, echoed as stored (an `invalid` entry may report a value
            outside 6 to 8).
          example: 6
        period:
          type: integer
          readOnly: true
          description: |
            Full representation, `state` set or invalid. The stored period
            in seconds, echoed as stored (an `invalid` entry may report a
            value outside 15 to 120).
          example: 30
        algorithm:
          type: string
          enum: [SHA1, SHA256, SHA512]
          nullable: true
          readOnly: true
          description: |
            Full representation, `state` set or invalid. `null` when the
            stored algorithm is one the server does not know.
          example: SHA1
        conforming:
          type: boolean
          readOnly: true
          description: |
            Full representation, `state` set or invalid. Whether the stored
            seed and parameters would pass the admission rules of
            `EntryTotpWrite` today.
          example: true

    EntryTotpWrite:
      type: object
      nullable: true
      description: |
        Write form of an entry's `totp` key in `createEntry` and
        `updateEntry` bodies (Server 20.0.0 and later). Exactly these four
        members exist; `{}`, any other member or a wrong JSON type answers
        `400` / `4005`. `null` removes the seed in `updateEntry` and does
        nothing in `createEntry`. In `createEntry`, `secret` is required and
        the other members default to SHA1 / 6 / 30. In `updateEntry`, only
        the members sent are validated and applied; absent members keep their
        stored values, and an absent `secret` keeps the stored seed without
        re-validating it -- send all four members whenever you send `secret`.
        The admission ranges are those of the server's authenticator: the
        first failing member, in the order secret, algorithm, digits, period,
        names the sub-code (4001 to 4004). The server computes a code once
        before it writes anything; a refused write changes nothing.
      minProperties: 1
      additionalProperties: false
      properties:
        secret:
          type: string
          writeOnly: true
          minLength: 16
          description: |
            The seed, Base32 (RFC 4648). Letters are upper-cased, whitespace
            is dropped and trailing `=` padding is removed before the length
            (16 to 128 characters) is checked; any other character is refused
            (`400` / `4001`). The limits apply to the normalised form:
            `minLength` holds for the raw value too, because normalisation
            only removes characters, but a raw value with whitespace or
            padding may be longer than 128 characters, so no `maxLength` is
            declared. The normalised form is stored. Never returned
            by any route. Required in `createEntry`; in `updateEntry`,
            sending it replaces the stored seed in one call and omitting it
            keeps the stored seed. `""` is not "remove" but an invalid seed.
          example: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
        algorithm:
          type: string
          enum: [SHA1, SHA256, SHA512]
          description: |
            Case-insensitive. Default in `createEntry`: SHA1. Otherwise
            `400` / `4002`; an empty string is refused, not read as SHA1.
          example: SHA1
        digits:
          type: integer
          minimum: 6
          maximum: 8
          description: |
            Code length. Default in `createEntry`: 6. Otherwise `400` /
            `4003`.
          example: 6
        period:
          type: integer
          minimum: 15
          maximum: 120
          description: |
            Seconds each code is valid. Default in `createEntry`: 30.
            Otherwise `400` / `4004`.
          example: 30

    # --- Search ---
    # Search reuses the Entry schema in paginated responses.

    # --- Permissions ---
    Permission:
      type: object
      description: |
        A permission binds a principal (user OR group, identified by
        `principal_id`) to a database, optionally gated by a validity
        window and a seal workflow. The basic view returned in list
        responses carries only identity and validity; the full view (from
        `GET /admin/databases/{db}/permissions/{id}`) additionally
        includes the allow/deny right tokens and per-entry overrides.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        principal_id:
          type: string
          format: uuid
          description: |
            ID of the user OR group this permission applies to. Whether
            it's a user or group is resolved by lookup on the server.
        issuer_id:
          type: string
          format: uuid
          description: ID of the user who created the permission
          readOnly: true
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
        # Full representation only
        allow:
          type: array
          items:
            $ref: "#/components/schemas/RightToken"
          description: Database-level allow rights
        deny:
          type: array
          items:
            $ref: "#/components/schemas/RightToken"
          description: Database-level deny rights (override `allow`)
        entry_allow:
          type: array
          items:
            $ref: "#/components/schemas/ItemRightOverride"
          description: Per-entry or per-folder allow overrides
        entry_deny:
          type: array
          items:
            $ref: "#/components/schemas/ItemRightOverride"
          description: Per-entry or per-folder deny overrides
        seal_status:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          description: |
            Seal workflow state:
            * 0 = unset
            * 1 = set (seal configured, access requires approval)
            * 2 = waiting (approval requested)
            * 3 = approved
            * 4 = broken (one-time access already consumed)
        approver_ids:
          type: array
          items:
            type: string
            format: uuid
          description: User IDs designated as seal approvers

    RightToken:
      type: string
      description: |
        A single right on a database. These tokens also appear under
        `entry_allow` / `entry_deny` when narrowed to a specific
        entry or folder.
      enum:
        - use
        - read
        - update
        - create
        - delete
        - print
        - export
        - save
        - auto_complete
        - addon_fill
        - addon_offer
        - sync
        - share
        - seal
        - second_pass

    ItemRightOverride:
      type: object
      description: |
        Per-entry or per-folder override of a right. The `target_id`
        points at an entry or folder; `rights` lists the right tokens
        that are overridden for that target.
      properties:
        target_id:
          type: string
          format: uuid
        rights:
          type: array
          items:
            $ref: "#/components/schemas/RightToken"

    # --- Users ---
    UserBasic:
      type: object
      description: |
        Fields returned for a user in EVERY context -- both the detail
        response (`GET /me`, `GET /admin/users/{id}`) and the list
        response (`GET /admin/users`). This is the output of the server's
        `SaveUserToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Username (immutable once created)
        auth_modes:
          type: array
          items:
            type: string
            enum:
              - standard
              - sspi
              - iwa
              - azure
              - oidc
              - webauthn
          description: Authentication methods allowed for this user
        two_factor_mode:
          type: string
          enum:
            - default
            - disabled
            - email
            - totp
            - fido2
          description: |
            Per-user 2FA mode. `default` inherits the server-wide setting;
            `disabled` opts out (suitable for service accounts); `fido2` uses
            a registered passkey / security key as the second factor.
        display_name:
          type: string
          description: Friendly name (`FullName` internally)
        department:
          type: string
        email:
          type: string
        phone:
          type: string
          description: Mobile phone number
        updated_at:
          type: string
          format: date-time
          readOnly: true

    User:
      description: |
        Full user representation as returned by `GET /me` and
        `GET /admin/users/{id}`. Extends `UserBasic` with the detail-only
        fields. For the client-scope directory at `GET /users/{id}` use
        `UserCompact` instead.
      allOf:
        - $ref: "#/components/schemas/UserBasic"
        - type: object
          properties:
            sam:
              type: string
              description: Windows SAM account name (DOMAIN\username)
            upn:
              type: string
              description: User principal name (user@domain.local)
            dn:
              type: string
              description: Distinguished name (AD)
            objectId:
              type: string
              description: AD objectId (GUID)
            disabled:
              type: boolean
            must_change_pass:
              type: boolean
            cannot_change_pass:
              type: boolean
            roles:
              type: array
              items:
                type: string
                enum:
                  - super_admin
                  - server_admin
                  - db_admin
                  - user_admin
                  - group_admin
                  - ad_operator
                  - log_reader
              description: Server-level roles granted to this user
            member_of:
              type: array
              items:
                type: string
                format: uuid
              description: IDs of groups this user belongs to
            last_login:
              type: string
              format: date-time
              readOnly: true
            passkeys:
              type: array
              items:
                $ref: "#/components/schemas/Credential"
              readOnly: true
              description: Registered passkeys for this user (compact representation, public key not exposed)

    # --- Groups ---
    GroupBasic:
      type: object
      description: |
        Fields returned for a group in EVERY context -- both the detail
        response (`GET /admin/groups/{id}`) and the list response
        (`GET /admin/groups`). This is the output of the server's
        `SaveGroupToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        department:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Group:
      description: |
        Full group representation as returned by `GET /admin/groups/{id}`.
        Extends `GroupBasic` with the detail-only fields. For the
        client-scope directory use `GroupCompact` instead.
      allOf:
        - $ref: "#/components/schemas/GroupBasic"
        - type: object
          properties:
            dn:
              type: string
              description: Distinguished name (AD)
            objectId:
              type: string
              description: AD objectId (GUID)
            ad_sync:
              type: boolean
              description: Whether this group is synchronized with Active Directory
            member_of:
              type: array
              items:
                type: string
                format: uuid
              description: IDs of parent groups this group belongs to
            members:
              type: array
              items:
                type: string
                format: uuid
              readOnly: true
              description: Calculated list of user/group IDs that are members of this group
            admins:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs designated as administrators of this group

    # --- Alerts ---
    AlertBasic:
      type: object
      description: |
        Fields returned for an alert in EVERY context -- both the detail
        response (`GET /admin/alerts/{id}`) and the list response
        (`GET /admin/alerts`). Output of the server's `SaveAlertToJSON`
        with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Server-generated human-readable name
        type:
          type: string
          description: Event type identifier (e.g. `user_login`, `db_size_changes`)
        notes:
          type: string
          description: Free-form notes included in the notification body
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Alert:
      description: |
        Full alert representation returned by `GET /admin/alerts/{id}`.
        Extends `AlertBasic` with recipient list and the per-database /
        per-user / per-entry scope filters. When an event matching `type`
        occurs, the server sends an email to each address in
        `recipients`. Scope can be narrowed to specific databases,
        users, or entries via the `filter_by_*` / `*_ids` pairs.
      allOf:
        - $ref: "#/components/schemas/AlertBasic"
        - type: object
          properties:
            recipients:
              type: array
              items:
                type: string
                format: email
              description: Email addresses to notify (validated on write)
            filter_by_databases:
              type: boolean
            database_ids:
              type: array
              items:
                type: string
                format: uuid
            filter_by_users:
              type: boolean
            user_ids:
              type: array
              items:
                type: string
                format: uuid
            filter_by_entries:
              type: boolean
            entry_ids:
              type: array
              items:
                type: string
                format: uuid

    # --- Secrets ---
    SecretBasic:
      type: object
      description: |
        Fields returned for a secret in EVERY context -- both detail
        (`GET /secrets/{id}`, `GET /admin/secrets/{id}`) and list
        (`GET /secrets`, `GET /admin/secrets`). Output of the server's
        `SaveSecretToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          description: Secret type (discriminator)
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - revoked
            - consumed
            - expired
          description: Current lifecycle state
          readOnly: true
        protocol:
          type: string
          enum:
            - https
            - pd-server
          description: |
            URL scheme to use when generating the link:
            `https` (browser) or `pd-server` (native client).
        author:
          type: string
          format: uuid
          readOnly: true
        database_id:
          type: string
          format: uuid
        database_name:
          type: string
          readOnly: true
        entry_id:
          type: string
          format: uuid
        entry_path:
          type: string
          readOnly: true
          description: Human-readable path of the shared entry within its database
        entry_user:
          type: string
          readOnly: true
        entry_type:
          type: string
          readOnly: true
          description: Type of the shared entry (e.g. `password`, `document`, `credit_card`)
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    Secret:
      description: |
        Full secret representation returned by detail endpoints. Extends
        `SecretBasic` with the approval workflow, quorum settings, and
        the link UUIDs (`open_uuid`, `approve_uuid`) that must be
        treated as credentials. Sub-commands (`/approve`, `/reject`,
        `/revoke`) are separate endpoints.

        Each UUID field is returned according to the caller's own role on
        the secret, in either scope: `open_uuid` to the author and to users
        whose own ID is in `recipient_ids`, `approve_uuid` to the author and
        to users whose own ID is in `approver_ids`. Any other caller,
        including an administrator using the admin scope, receives the
        object without that field, and the `/approve` and `/reject`
        responses carry `open_uuid` only when the approver is also the
        author or a listed recipient. Clients must treat both fields as
        optional. See the field descriptions.
      allOf:
        - $ref: "#/components/schemas/SecretBasic"
        - type: object
          properties:
            notes:
              type: string
            access_max:
              type: integer
              description: Maximum number of times the secret may be accessed (0 = unlimited)
            access_count:
              type: integer
              readOnly: true
              description: How many times the secret has been accessed
            include_totp:
              type: boolean
              description: |
                Whether the recipient gets the shared entry's one-time code.
                Default `true`, also when omitted on create; on `PATCH` an
                omitted value keeps the stored one. With `true`, the HTTPS
                shared-link page shows the code that is current at the moment
                the page is opened (the page does not refresh it and never
                shows the seed), and over `pd-server` the TOTP seed travels
                with the entry, so the recipient's client computes the codes.
                With `false`, neither happens: the page shows no one-time
                code and the entry is delivered without its seed. The value
                is kept across server restarts and is read each time the
                secret is opened. Servers before 20.0.0 accepted and echoed
                the value but neither kept it across a restart nor applied
                it: every shared link behaved as `true`. No REST response
                ever carries the seed.
            approval_required:
              type: boolean
            quorum_n:
              type: integer
              description: Required number of approvers in the M-of-N scheme
            quorum_m:
              type: integer
              description: Total number of approvers in the M-of-N scheme
            require_2fa:
              type: boolean
              description: Recipient must complete 2FA before receiving the secret
            recipient_ids:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs of the recipients
            approver_ids:
              type: array
              items:
                type: string
                format: uuid
              description: User IDs of designated approvers
            approved_by:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  at:
                    type: string
                    format: date-time
              readOnly: true
            rejected_by:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  at:
                    type: string
                    format: date-time
              readOnly: true
            open_uuid:
              type: string
              readOnly: true
              description: >
                Token embedded in the recipient-access URL; treat it as a
                credential. Returned only to the secret's author and to
                users whose own ID is in `recipient_ids` (membership of a
                listed group is not enough), and absent for every other
                caller.
            approve_uuid:
              type: string
              readOnly: true
              description: >
                Token embedded in the approver URL; treat it as a
                credential. Returned only to the secret's author and to
                users whose own ID is in `approver_ids`, and absent for every
                other caller.

    # --- Common ---
    CustomField:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        type:
          type: string
          description: "Field type (text, password, url, email, date, etc.)"

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
          description: Array of result items
        total:
          type: integer
          description: Total number of items matching the query
        offset:
          type: integer
          description: Number of items skipped
        limit:
          type: integer
          description: Maximum number of items returned

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              description: |
                Machine-readable error code. Normally equals the HTTP status
                code, but MAY carry an
                application sub-code (`>= 1000`) for a finer machine-readable reason while
                the HTTP status stays the authority for the response class. The sub-codes
                are `4001` (`PD_ERRCODE_TOTP_SECRET`), `4002` (`PD_ERRCODE_TOTP_ALGORITHM`),
                `4003` (`PD_ERRCODE_TOTP_DIGITS`), `4004` (`PD_ERRCODE_TOTP_PERIOD`), `4005`
                (`PD_ERRCODE_TOTP_SHAPE`) and `4006` (`PD_ERRCODE_TOTP_ENTRY_TYPE`) -- a
                refused `totp` write in `createEntry` / `updateEntry` (Server 20.0.0 and
                later; the first sub-codes of the `400` family, so match the HTTP status
                rather than `error.code == 400`), `4007` (`PD_ERRCODE_ICON_ASSIGNMENT` --
                `image_custom` / `image_index` / `image_name` in `createEntry`,
                `updateEntry`, `createFolder` or `updateFolder` do not name a usable icon,
                nothing was written) and `4008` (`PD_ERRCODE_ICON_IMAGE` -- `data` in
                `uploadDatabaseIcon` is not a usable PNG), all with HTTP `400` (`4007` and
                `4008`: Server 20.0.0 and later); `4012`
                (`PD_ERRCODE_2FA_EMAIL_SEND_FAILED` -- e-mail two-factor
                authentication, the verification e-mail cannot be sent) and `4013`
                (`PD_ERRCODE_2FA_EMAIL_MISSING` -- e-mail two-factor authentication, no
                e-mail address), both with HTTP `401` from `POST /auth/login` (Server
                20.0.0 and later); `4031` (`PD_ERRCODE_INVALID_SECOND_PASS` -- wrong or
                missing second password), `4032` (`PD_ERRCODE_LICENSE_LIMIT` -- the
                licensed number of users is reached, `POST /admin/users`, Server 20.0.0 and
                later), `4033` (`PD_ERRCODE_TOTP_READ_REQUIRED` -- a `totp` write in
                `updateEntry` needs read permission on the entry, Server 20.0.0 and later)
                and `4034` (`PD_ERRCODE_ICON_QUOTA` -- `uploadDatabaseIcon`: the database
                cannot hold another icon, Server 20.0.0 and later)
                with HTTP `403`;
                `4041` (`PD_ERRCODE_NO_ONE_TIME_CODE` -- the entry has no one-time code) and
                `4042` (`PD_ERRCODE_ICON_NOT_FOUND` -- `getDatabaseIcon`: no usable icon with
                that id in this database, Server 20.0.0 and later) with HTTP `404`; and
                `4131` (`PD_ERRCODE_ICON_TOO_LARGE` -- `uploadDatabaseIcon`: too many bytes,
                too many pixels or too large a stored record, Server 20.0.0 and later; the
                first sub-code of the `413` family) with
                HTTP `413`. Do not infer a reason from an unrecognised sub-code; show a neutral
                message. Always match the numeric code, never the localized message.
            message:
              type: string
              description: Human-readable error message

    # -------------------------------------------------------------------------
    # Self-Service (/me/...)
    # -------------------------------------------------------------------------
    ProfileUpdateRequest:
      type: object
      description: |
        Partial update. Send only the fields you want to change. Unknown
        fields are rejected with 400.
      properties:
        display_name:
          type: string
          description: Friendly name ("FullName" internally)
        department:
          type: string
        phone:
          type: string

    PasswordChangeRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          description: The caller's current password (must match the stored hash)
        new_password:
          type: string
          description: The new password; must satisfy the server's password policy

    # -------------------------------------------------------------------------
    # Passkeys / WebAuthn
    # -------------------------------------------------------------------------
    CredentialBasic:
      type: object
      description: |
        Registered WebAuthn credential (passkey) as returned in lists
        (`GET /me/passkeys`, `GET /admin/users/{user_id}/passkeys`) and
        embedded inside `User.passkeys`. Output of the server's
        `SaveCredentialToJSON` with `AFullRepresentation=False`.
      properties:
        id:
          type: string
          description: Server-issued credential identifier
          readOnly: true
        name:
          type: string
          description: Friendly name; editable via `PATCH /me/passkeys/{id}`
        transports:
          type: array
          items:
            type: string
            enum:
              - usb
              - nfc
              - ble
              - internal
              - hybrid
          description: Authenticator transports supported by this credential
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true

    Credential:
      description: |
        Full WebAuthn credential representation. Extends `CredentialBasic`
        with the technical fields that are only useful in detail views.
      allOf:
        - $ref: "#/components/schemas/CredentialBasic"
        - type: object
          properties:
            type:
              type: string
              description: Credential type (typically "public-key")
              readOnly: true
            alg:
              type: integer
              description: COSE algorithm identifier (e.g., -7 = ES256, -257 = RS256)
              readOnly: true
            sign_count:
              type: integer
              description: Authenticator signature counter (monotonic)
              readOnly: true

    WebAuthnRegistrationBeginResponse:
      type: object
      description: |
        Passes through the W3C `PublicKeyCredentialCreationOptions`
        structure plus a server-issued `session_id` used to correlate the
        subsequent `/me/passkeys/complete` call.
      properties:
        session_id:
          type: string
          description: Opaque session identifier (short-lived, single-use)
        publicKey:
          type: object
          description: W3C PublicKeyCredentialCreationOptions (JSON form)
          additionalProperties: true

    WebAuthnRegistrationCompleteRequest:
      type: object
      description: |
        Authenticator attestation response (as produced by
        `navigator.credentials.create(...)`), plus `session_id` from the
        preceding `/me/passkeys/begin` call.
      required:
        - session_id
      properties:
        session_id:
          type: string
        id:
          type: string
          description: Base64url-encoded credential ID
        rawId:
          type: string
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          description: Authenticator attestation response
          additionalProperties: true
        name:
          type: string
          description: Optional friendly name for the new credential

    WebAuthnAssertionBeginRequest:
      type: object
      required:
        - user
      properties:
        user:
          type: string
          description: Username
        scope:
          type: string
          enum:
            - client
            - admin
          default: client

    WebAuthnAssertionBeginResponse:
      type: object
      properties:
        session_id:
          type: string
        publicKey:
          type: object
          description: W3C PublicKeyCredentialRequestOptions (JSON form)
          additionalProperties: true

    WebAuthnAssertionCompleteRequest:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          additionalProperties: true

    # -------------------------------------------------------------------------
    # API tokens (issued by Server Manager; read-only surface for now)
    # -------------------------------------------------------------------------
    ApiToken:
      type: object
      description: |
        Long-lived API token descriptor. Emitted when listing tokens in
        the Server Manager. The token material itself (`access_token`)
        is returned only once at creation time and never again.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier; also used as the JWT `jti` claim
          readOnly: true
        name:
          type: string
          description: Friendly name (e.g. "CI pipeline")
        user_id:
          type: string
          format: uuid
          description: Owning user
        admin_scope:
          type: boolean
          description: If true, the token authorizes admin-scope requests
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
        lastused_at:
          type: string
          format: date-time
          readOnly: true
        revoked:
          type: boolean

    # -------------------------------------------------------------------------
    # Compact user / group directory
    # -------------------------------------------------------------------------
    UserCompact:
      type: object
      description: |
        Compact user record returned by the client-scope directory
        (`GET /users`, `GET /users/{id}`). Output of the server's
        `SaveUserToJSONCompact`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        display_name:
          type: string
        department:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true

    GroupCompact:
      type: object
      description: |
        Compact group record returned by the client-scope directory
        (`GET /groups`, `GET /groups/{id}`). Output of the server's
        `SaveGroupToJSONCompact`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        department:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # -------------------------------------------------------------------------
    # Folder/entry children list
    # -------------------------------------------------------------------------
    ChildrenList:
      type: object
      description: |
        Paginated list of a folder's (or the database root's) direct
        children. `data` contains a heterogeneous mix of folders and
        entries in their basic (list) representation, distinguished by
        the `type` field. `path` is the ancestor breadcrumb trail from the
        database root down to (but not including) the current folder; it is
        an empty array at the root. The envelope contains only `path`,
        `data`, `total`, `offset`, and `limit` -- there are no top-level
        `name`, `parent`, or `has_second_pass` fields.
      properties:
        path:
          type: array
          readOnly: true
          description: Ancestor breadcrumb trail (root-first); empty at the root.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        data:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/FolderBasic"
              - $ref: "#/components/schemas/Entry"
            discriminator:
              propertyName: type
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
