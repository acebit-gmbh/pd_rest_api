openapi: 3.0.3
info:
  title: Password Depot Enterprise Server REST API
  description: |
    REST API for Password Depot Enterprise Server.

    ## Authentication

    All endpoints except `/auth/login`, `/auth/oidc`, and
    `/auth/webauthn/{begin,complete}` require a valid
    `Authorization: Bearer {access_token}` header obtained from the login
    endpoint. Tokens are JWTs signed with HS256; presence of the `jti` claim
    indicates a long-lived API token (issued via the Server Manager).

    ## Pagination

    List endpoints support pagination via `offset` and `limit` query
    parameters (default 100, max 1000, clamped). Responses use the envelope
    `{ "data": [...], "total": N, "offset": O, "limit": L }`.

    ## Error format

    All non-2xx responses use the envelope
    `{ "error": { "code": N, "message": "..." } }`. See the
    `#/components/responses` section for reusable response definitions
    (`BadRequest`, `Unauthorized`, `Forbidden`, `NotFound`, `MethodNotAllowed`,
    `PayloadTooLarge`, `TooManyRequests`).

    The `error.code` field normally equals the HTTP status, but may carry an
    application sub-code (`>= 1000`) for a finer machine-readable reason while
    the HTTP status stays the authority for the response class. The sub-codes
    are `4001` (`PD_ERRCODE_TOTP_SECRET`), `4002` (`PD_ERRCODE_TOTP_ALGORITHM`),
    `4003` (`PD_ERRCODE_TOTP_DIGITS`), `4004` (`PD_ERRCODE_TOTP_PERIOD`), `4005`
    (`PD_ERRCODE_TOTP_SHAPE`) and `4006` (`PD_ERRCODE_TOTP_ENTRY_TYPE`) -- a
    refused `totp` write in `createEntry` / `updateEntry` (Server 20.0.0 and
    later; the first sub-codes of the `400` family, so match the HTTP status
    rather than `error.code == 400`), `4007` (`PD_ERRCODE_ICON_ASSIGNMENT` --
    `image_custom` / `image_index` / `image_name` in `createEntry`,
    `updateEntry`, `createFolder` or `updateFolder` do not name a usable icon,
    nothing was written) and `4008` (`PD_ERRCODE_ICON_IMAGE` -- `data` in
    `uploadDatabaseIcon` is not a usable PNG), all with HTTP `400` (`4007` and
    `4008`: Server 20.0.0 and later); `4012`
    (`PD_ERRCODE_2FA_EMAIL_SEND_FAILED` -- e-mail two-factor
    authentication, the verification e-mail cannot be sent) and `4013`
    (`PD_ERRCODE_2FA_EMAIL_MISSING` -- e-mail two-factor authentication, no
    e-mail address), both with HTTP `401` from `POST /auth/login` (Server
    20.0.0 and later); `4031` (`PD_ERRCODE_INVALID_SECOND_PASS` -- wrong or
    missing second password), `4032` (`PD_ERRCODE_LICENSE_LIMIT` -- the
    licensed number of users is reached, `POST /admin/users`, Server 20.0.0 and
    later), `4033` (`PD_ERRCODE_TOTP_READ_REQUIRED` -- a `totp` write in
    `updateEntry` needs read permission on the entry, Server 20.0.0 and later)
    and `4034` (`PD_ERRCODE_ICON_QUOTA` -- `uploadDatabaseIcon`: the database
    cannot hold another icon, Server 20.0.0 and later)
    with HTTP `403`;
    `4041` (`PD_ERRCODE_NO_ONE_TIME_CODE` -- the entry has no one-time code) and
    `4042` (`PD_ERRCODE_ICON_NOT_FOUND` -- `getDatabaseIcon`: no usable icon with
    that id in this database, Server 20.0.0 and later) with HTTP `404`; and
    `4131` (`PD_ERRCODE_ICON_TOO_LARGE` -- `uploadDatabaseIcon`: too many bytes,
    too many pixels or too large a stored record, Server 20.0.0 and later; the
    first sub-code of the `413` family) with
    HTTP `413`. Do not infer a reason from an unrecognised sub-code; show a neutral
    message. Always match the numeric code, never the localized message.

    ## Response headers

    Every response includes `Cache-Control: no-store` and `Pragma: no-cache`
    (on all `/v2.0` and `/v1.0` endpoints, `/file` and `/temp` downloads,
    `OPTIONS` preflight, and JSON error responses). API responses can carry
    plaintext secrets and must never be written to a shared or browser disk
    cache. The shared-link HTML page (`GET /shared/...`) uses the slightly
    stricter `Cache-Control: no-cache, no-store`.

    ## Timestamps

    All entity timestamp fields are genuine UTC instants with a trailing `Z`
    (RFC 3339). Inbound timestamp fields are interpreted as true UTC and
    round-trip exactly. Date-only custom-field values carry no timezone shift.

    ## Cross-cutting status codes

    The following error responses may be returned by any endpoint and are
    generally not enumerated per-operation:

    - `400 Bad Request` -- malformed JSON body or unknown enum value.
    - `405 Method Not Allowed` -- includes an `Allow` header listing
      supported methods (RFC 7231 §6.5.5).
    - `403 Forbidden` -- on a mirror server, every request other than `GET`
      that carries a bearer token (`POST /auth/logout` included).
    - `413 Payload Too Large` -- JSON bodies cap at 1 MB, document-content
      uploads at 64 MB. This check reads `Content-Length` before the body,
      before authentication and before the CORS headers are added, and the
      connection is closed, so a browser reports a network error.
      `uploadDatabaseIcon` reports its own, smaller limits as a regular JSON
      error with `error.code` `4131`.
    - `429 Too Many Requests` -- IP-lockout triggered by repeated failed
      logins. Includes a `Retry-After` header (seconds).
  version: "2.0"
  contact:
    name: AceBIT GmbH
    url: https://www.password-depot.de
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{server}:{port}/v2.0
    description: Password Depot Enterprise Server
    variables:
      server:
        default: localhost
        description: Hostname or IP address of the server
      port:
        default: "443"
        description: HTTPS port

tags:
  - name: Authentication
    description: Login, logout, OIDC provider discovery, WebAuthn challenge flow
  - name: Self-Service
    description: Endpoints the current user can call on their own account (profile, password, passkeys)
  - name: Databases
    description: Client database access
  - name: Folders
    description: Folder management within a database
  - name: Entries
    description: Entry (credential) management within a database
  - name: Icons
    description: Icons stored in a database ("custom icons"); list, fetch and upload (Server 20.0.0 and later)
  - name: Search
    description: Full-text search across database entries
  - name: Users (directory)
    description: Read-only user directory available to all authenticated callers
  - name: Groups (directory)
    description: Read-only group directory available to all authenticated callers
  - name: Secrets
    description: Shared-secret links (client scope)
  - name: Admin - Databases
    description: Database management (admin scope required)
  - name: Admin - Permissions
    description: Permission management (admin scope required)
  - name: Admin - Users
    description: User management (admin scope required)
  - name: Admin - Groups
    description: Group management (admin scope required)
  - name: Admin - Alerts
    description: Alert management (admin scope required)
  - name: Admin - Secrets
    description: Secret management (admin scope required)
  - name: Admin - Passkeys
    description: User passkey (WebAuthn credential) administration

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: Authenticate and obtain an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Authentication failed; no token is issued. `error.code` gives the
            reason: `401` -- invalid credentials or locked account; `4012`
            (`PD_ERRCODE_2FA_EMAIL_SEND_FAILED`) -- two-factor mode is `email`
            and the server cannot send the verification e-mail; `4013`
            (`PD_ERRCODE_2FA_EMAIL_MISSING`) -- two-factor mode is `email` and
            the account has no e-mail address. Neither 4012 nor 4013 means the
            password was wrong, and neither counts towards the IP lockout (429).
            4012/4013: Server 20.0.0 and later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  summary: Invalid credentials
                  value:
                    error:
                      code: 401
                      message: "Logon failure: unknown user name or bad password."
                emailSendFailed:
                  summary: Verification e-mail cannot be sent
                  value:
                    error:
                      code: 4012
                      message: "Failed to send the authentication email. Please contact your administrator."
                emailMissing:
                  summary: No e-mail address on the account
                  value:
                    error:
                      code: 4013
                      message: "User email is not defined. Please contact your Password Depot Server administrator."
        "409":
          description: |
            The user account has FIDO2 (security key / passkey) configured as
            the second factor. The interactive FIDO2 challenge cannot be
            driven from a stateless REST request -- log in via the native
            Password Depot client, or ask an administrator to switch the
            user's `two_factor_mode` to `totp` or `email`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 409
                  message: "FIDO2 two-factor authentication is not supported via the REST API. Log in via the native Password Depot client, or ask an administrator to switch your second factor to TOTP or email."
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "459":
          description: Two-factor authentication not yet activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 459
                  message: "https://your-server:8714/v2.0/temp/qr123456.png"
        "460":
          description: Two-factor authentication code required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 460
                  message: "Password Depot Enterprise Server requires two-factor authentication."

  /auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      summary: Invalidate the current access token
      responses:
        "204":
          description: Logged out successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/oidc:
    get:
      operationId: getOidcProviders
      tags:
        - Authentication
      summary: List configured OpenID Connect providers
      security: []
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of OIDC providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OidcProvider"

  # ---------------------------------------------------------------------------
  # Databases (client)
  # ---------------------------------------------------------------------------
  /databases:
    get:
      operationId: listDatabases
      tags:
        - Databases
      summary: List all databases
      description: Returns a paginated list of databases accessible by the authenticated user.
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of databases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DatabaseBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /databases/{id}:
    get:
      operationId: getDatabase
      tags:
        - Databases
      summary: Get a database by ID
      parameters:
        - $ref: "#/components/parameters/DatabaseId"
      responses:
        "200":
          description: Database details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Folders
  # ---------------------------------------------------------------------------
  /databases/{db}/folders:
    get:
      operationId: listFolders
      tags:
        - Folders
      summary: List folders in a database
      description: |
        Returns root-level folders by default. Use the `parent` query parameter
        to list children of a specific folder.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - name: parent
          in: query
          description: Parent folder ID to list children of. Omit for root-level folders.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of folders (basic representation)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FolderBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createFolder
      tags:
        - Folders
      summary: Create a new folder
      description: |
        Create a folder in the database. Set `parent` to an existing folder ID
        to create a subfolder, or omit it to create at root level.

        `image_custom`, `image_index` and `image_name` (validated from Server
        20.0.0 on) select the folder's icon: `image_custom: true` with
        `image_name` = the `name` of an icon of this database (see
        `listDatabaseIcons`, `uploadDatabaseIcon`; a client-sent `image_index`
        is ignored), `image_custom: false` with `image_index` `0` to `134` for a
        standard icon, or `image_custom: false` with `image_index` `-1` for the
        standard folder icon. A body with none of the three keys
        leaves the icon alone and is not checked; a body that repeats the
        stored values is never refused. Anything else that does not name a
        usable icon answers `400` with `error.code` `4007`
        (`PD_ERRCODE_ICON_ASSIGNMENT`), and nothing is written. Never `409`.
        Servers older than 20.0.0 store any value; detect support by the
        `icons` object on the database.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Folder"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          description: |
            Invalid or missing fields (`error.code` 400), or
            `error.code` 4007 (`PD_ERRCODE_ICON_ASSIGNMENT`, Server 20.0.0 and
            later): `image_custom`, `image_index` and `image_name` do not name
            a usable icon -- `image_custom` true with an `image_name` that names
            no icon of this database, `image_custom` false with a non-empty
            `image_name`, or `image_custom` false with `image_index` outside
            -1 to 134. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/folders/{id}:
    get:
      operationId: getFolder
      tags:
        - Folders
      summary: Get a folder by ID
      description: Returns the folder details including a list of child folder IDs.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200":
          description: Folder details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFolder
      tags:
        - Folders
      summary: Update a folder
      description: |
        Update a folder. When the target folder is second-password protected
        (`has_second_pass=true`), a correct `X-Second-Password` header is
        required and is verified; a wrong or missing one is rejected with
        `403` (`error.code` `4031`). To change the second password, send the
        new value in `X-New-Second-Password` together with the correct current
        `X-Second-Password`. Folders without a second password are unaffected.

        `image_custom`, `image_index` and `image_name` (validated from Server
        20.0.0 on) select the folder's icon: `image_custom: true` with
        `image_name` = the `name` of an icon of this database (see
        `listDatabaseIcons`, `uploadDatabaseIcon`; a client-sent `image_index`
        is ignored), `image_custom: false` with `image_index` `0` to `134` for a
        standard icon, or `image_custom: false` with `image_index` `-1` for the
        standard folder icon. A body with none of the three keys
        leaves the icon alone and is not checked; a body that repeats the
        stored values is never refused. Anything else that does not name a
        usable icon answers `400` with `error.code` `4007`
        (`PD_ERRCODE_ICON_ASSIGNMENT`), and nothing is written:
        the folder keeps its name, its other fields, its second password and
        its previous icon. The check runs after `X-Second-Password` is verified
        and before `X-New-Second-Password` is applied. Never `409`.
        Servers older than 20.0.0 store any value; detect support by the
        `icons` object on the database.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/FolderId"
        - name: X-Second-Password
          in: header
          required: false
          description: |
            Current second password. Required (and verified) when the target
            folder is second-password protected; otherwise the request fails
            with `403` and `error.code` `4031`.
          schema:
            type: string
        - name: X-New-Second-Password
          in: header
          required: false
          description: |
            New second password to set. Must be accompanied by the correct
            current `X-Second-Password`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Folder"
      responses:
        "200":
          description: Folder updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          description: |
            Invalid fields (`error.code` 400), or
            `error.code` 4007 (`PD_ERRCODE_ICON_ASSIGNMENT`, Server 20.0.0 and
            later): `image_custom`, `image_index` and `image_name` do not name
            a usable icon -- `image_custom` true with an `image_name` that names
            no icon of this database, `image_custom` false with a non-empty
            `image_name`, or `image_custom` false with `image_index` outside
            -1 to 134. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Insufficient permissions, or -- when the folder is
            second-password protected -- a wrong or missing
            `X-Second-Password`. The latter case returns `error.code` `4031`
            (`PD_ERRCODE_INVALID_SECOND_PASS`); a generic access-denied keeps
            `error.code` `403`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFolder
      tags:
        - Folders
      summary: Delete a folder
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/FolderId"
      responses:
        "204":
          description: Folder deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Entries
  # ---------------------------------------------------------------------------
  /databases/{db}/entries:
    get:
      operationId: listEntries
      tags:
        - Entries
      summary: List entries in a database
      description: |
        Returns entries in the database. Use the `folder` query parameter to
        filter by folder. Supports pagination.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - name: folder
          in: query
          description: Filter entries by folder ID
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createEntry
      tags:
        - Entries
      summary: Create a new entry
      description: |
        Create an entry in the database. Set `folder_id` to place it in a
        folder, or omit it to create at root level.

        `totp` (Server 20.0.0 and later) stores a one-time-code (TOTP) seed
        with the new entry: an `EntryTotpWrite` object whose `secret` is
        required here; `algorithm`, `digits` and `period` default to `SHA1`,
        `6` and `30`. `null` is accepted and does nothing. Only `password`,
        `credit_card`, `license`, `banking` and `custom` entries may carry
        one (`400` / `4006` otherwise; `501` for `encrypted_file` and
        `certificate`). The server computes a code once before it writes
        anything, so a refused `totp` creates nothing and an accepted one
        always yields `has_otp: true`. The seed is never
        returned. The write is audited as an entry creation, never as an
        access. Servers older than 20.0.0 ignore the key; detect support by
        the presence of `totp` in any entry response.

        `image_custom`, `image_index` and `image_name` (validated from Server
        20.0.0 on) select the entry's icon: `image_custom: true` with
        `image_name` = the `name` of an icon of this database (see
        `listDatabaseIcons`, `uploadDatabaseIcon`; a client-sent `image_index`
        is ignored), `image_custom: false` with `image_index` `0` to `134` for a
        standard icon, or `image_custom: false` with `image_index` `-1` for the
        standard icon of the entry's type. A body with none of the three keys
        leaves the icon alone and is not checked; a body that repeats the
        stored values is never refused. Anything else that does not name a
        usable icon answers `400` with `error.code` `4007`
        (`PD_ERRCODE_ICON_ASSIGNMENT`), and nothing is written -- the entry is not
        created. The icon is checked before `X-New-Second-Password` and before
        `totp`. Never `409`.
        Servers older than 20.0.0 store any value; detect support by the
        `icons` object on the database.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Entry"
                - type: object
                  properties:
                    totp:
                      $ref: "#/components/schemas/EntryTotpWrite"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: |
            Invalid or missing fields (`error.code` 400), or a refused `totp`
            object: `error.code` 4001 (secret), 4002 (algorithm), 4003
            (digits), 4004 (period), 4005 (shape: `{}`, an unknown member, a
            wrong JSON type, or no `secret`), 4006 (the entry's type cannot
            carry a one-time code). The first failing member in the order
            secret, algorithm, digits, period names the code.

            `error.code` 4007 (`PD_ERRCODE_ICON_ASSIGNMENT`, Server 20.0.0 and
            later): `image_custom`, `image_index` and `image_name` do not name
            a usable icon -- `image_custom` true with an `image_name` that names
            no icon of this database, `image_custom` false with a non-empty
            `image_name`, or `image_custom` false with `image_index` outside
            -1 to 134. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: "`totp` sent with `type` `encrypted_file` or `certificate`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /databases/{db}/entries/{id}:
    get:
      operationId: getEntry
      tags:
        - Entries
      summary: Get a full entry by ID
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/SecondPasswordHeader"
      responses:
        "200":
          description: Full entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `error.code` 4031: wrong or missing second password.
            `error.code` 403: no permission, or the entry is sealed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEntry
      tags:
        - Entries
      summary: Update an entry
      description: |
        Update an entry. When the target entry is second-password protected
        (`has_second_pass=true`), a correct `X-Second-Password` header is
        required and is verified; a wrong or missing one is rejected with
        `403` (`error.code` `4031`). To change the second password, send the
        new value in `X-New-Second-Password` together with the correct current
        `X-Second-Password`. Entries without a second password are unaffected.

        `totp` (Server 20.0.0 and later) writes the entry's one-time-code
        (TOTP) settings. Key absent: untouched. `null`: the seed is removed
        and the parameters reset to `SHA1` / `6` / `30` (an entry without a
        seed is left unchanged). An `EntryTotpWrite` object with `secret`:
        the seed is set or replaced in one call. An
        object without `secret`: only the members sent change; the stored
        seed is kept and not re-validated (`400` / `4005` when the entry has
        no seed). One merge rule: members that arrive are validated and
        applied, members that are absent keep their stored values -- so send
        all four members whenever you send `secret`. The server computes a
        code once before it writes anything; a refused `totp` changes nothing.
        Besides update permission, a `totp` write needs read permission on
        the entry (`403` / `4033`) and answers a plain `403` for an entry
        sealed for the caller; the second password is checked first. Only
        `password`, `credit_card`, `license`, `banking` and `custom` entries
        accept the key (`400` / `4006`; `501` for `encrypted_file` and
        `certificate`; `null` on an entry without a seed does nothing,
        whatever the type). A link's `totp` is the link's own, the one
        `getEntryOneTimeCode` computes from; the `409` link guard does not
        apply, and a refused `totp` never answers `409`. The write is audited
        as an entry update with an operation-specific message (set, replaced,
        parameters changed, removed), never as an access. Long-lived API
        tokens may write seeds like a session. The seed is never returned.

        `image_custom`, `image_index` and `image_name` (validated from Server
        20.0.0 on) select the entry's icon: `image_custom: true` with
        `image_name` = the `name` of an icon of this database (see
        `listDatabaseIcons`, `uploadDatabaseIcon`; a client-sent `image_index`
        is ignored), `image_custom: false` with `image_index` `0` to `134` for a
        standard icon, or `image_custom: false` with `image_index` `-1` for the
        standard icon of the entry's type. A body with none of the three keys
        leaves the icon alone and is not checked; a body that repeats the
        stored values is never refused. Anything else that does not name a
        usable icon answers `400` with `error.code` `4007`
        (`PD_ERRCODE_ICON_ASSIGNMENT`), and nothing is written: no field, no
        history item, no second-password change. The check runs after
        `X-Second-Password` is verified and before `X-New-Second-Password` and
        `totp` are looked at. Never `409`.
        Servers older than 20.0.0 store any value; detect support by the
        `icons` object on the database.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/EntryId"
        - name: X-Second-Password
          in: header
          required: false
          description: |
            Current second password. Required (and verified) when the target
            entry is second-password protected; otherwise the request fails
            with `403` and `error.code` `4031`.
          schema:
            type: string
        - name: X-New-Second-Password
          in: header
          required: false
          description: |
            New second password to set. Must be accompanied by the correct
            current `X-Second-Password`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Entry"
                - type: object
                  properties:
                    totp:
                      $ref: "#/components/schemas/EntryTotpWrite"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: |
            Invalid fields (`error.code` 400), or a refused `totp` write:
            `error.code` 4001 (secret), 4002 (algorithm), 4003 (digits), 4004
            (period), 4005 (shape: `{}`, an unknown member, a wrong JSON type,
            or an object without `secret` on an entry that has no seed), 4006
            (the entry's type cannot carry a one-time code). The first failing
            member in the order secret, algorithm, digits, period names the
            code.

            `error.code` 4007 (`PD_ERRCODE_ICON_ASSIGNMENT`, Server 20.0.0 and
            later): `image_custom`, `image_index` and `image_name` do not name
            a usable icon -- `image_custom` true with an `image_name` that names
            no icon of this database, `image_custom` false with a non-empty
            `image_name`, or `image_custom` false with `image_index` outside
            -1 to 134. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Insufficient permissions, or -- when the entry is second-password
            protected -- a wrong or missing `X-Second-Password`. The latter
            case returns `error.code` `4031`
            (`PD_ERRCODE_INVALID_SECOND_PASS`); a generic access-denied keeps
            `error.code` `403`. A `totp` write without read permission on the
            entry returns `error.code` `4033`
            (`PD_ERRCODE_TOTP_READ_REQUIRED`); a `totp` write on an entry
            sealed for the caller keeps `error.code` `403`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: "`totp` sent for an entry of type `encrypted_file` or `certificate`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEntry
      tags:
        - Entries
      summary: Delete an entry
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: Entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

