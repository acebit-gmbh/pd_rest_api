openapi: 3.0.3
info:
  title: Password Depot Enterprise Server REST API
  description: |
    REST API for Password Depot Enterprise Server.

    ## Authentication

    All endpoints except `/auth/login`, `/auth/oidc`, and
    `/auth/webauthn/{begin,complete}` require a valid
    `Authorization: Bearer {access_token}` header obtained from the login
    endpoint. Tokens are JWTs signed with HS256; presence of the `jti` claim
    indicates a long-lived API token (issued via the Server Manager).

    ## Pagination

    List endpoints support pagination via `offset` and `limit` query
    parameters (default 100, max 1000, clamped). Responses use the envelope
    `{ "data": [...], "total": N, "offset": O, "limit": L }`.

    ## Error format

    All non-2xx responses use the envelope
    `{ "error": { "code": N, "message": "..." } }`. See the
    `#/components/responses` section for reusable response definitions
    (`BadRequest`, `Unauthorized`, `Forbidden`, `NotFound`, `MethodNotAllowed`,
    `PayloadTooLarge`, `TooManyRequests`).

    The `error.code` field normally equals the HTTP status, but may carry an
    application sub-code (`>= 1000`) for a finer machine-readable reason while
    the HTTP status stays the authority for the response class. Currently the
    only such sub-code is `4031` (`PD_ERRCODE_INVALID_SECOND_PASS` -- wrong or
    missing second password) returned with HTTP `403`. Always match the numeric
    code, never the localized message.

    ## Response headers

    Every response includes `Cache-Control: no-store` and `Pragma: no-cache`
    (on all `/v2.0` and `/v1.0` endpoints, `/file` and `/temp` downloads,
    `OPTIONS` preflight, and JSON error responses). API responses can carry
    plaintext secrets and must never be written to a shared or browser disk
    cache. The shared-link HTML page (`GET /shared/...`) uses the slightly
    stricter `Cache-Control: no-cache, no-store`.

    ## Timestamps

    All entity timestamp fields are genuine UTC instants with a trailing `Z`
    (RFC 3339). Inbound timestamp fields are interpreted as true UTC and
    round-trip exactly. Date-only custom-field values carry no timezone shift.

    ## Cross-cutting status codes

    The following error responses may be returned by any endpoint and are
    generally not enumerated per-operation:

    - `400 Bad Request` -- malformed JSON body or unknown enum value.
    - `405 Method Not Allowed` -- includes an `Allow` header listing
      supported methods (RFC 7231 §6.5.5).
    - `413 Payload Too Large` -- JSON bodies cap at 1 MB, document-content
      uploads at 64 MB.
    - `429 Too Many Requests` -- IP-lockout triggered by repeated failed
      logins. Includes a `Retry-After` header (seconds). Loopback addresses
      are exempt from the block list.
  version: "2.0"
  contact:
    name: AceBIT GmbH
    url: https://www.password-depot.de
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{server}:{port}/v2.0
    description: Password Depot Enterprise Server
    variables:
      server:
        default: localhost
        description: Hostname or IP address of the server
      port:
        default: "443"
        description: HTTPS port

tags:
  - name: Authentication
    description: Login, logout, OIDC provider discovery, WebAuthn challenge flow
  - name: Self-Service
    description: Endpoints the current user can call on their own account (profile, password, passkeys)
  - name: Databases
    description: Client database access
  - name: Folders
    description: Folder management within a database
  - name: Entries
    description: Entry (credential) management within a database
  - name: Search
    description: Full-text search across database entries
  - name: Users (directory)
    description: Read-only user directory available to all authenticated callers
  - name: Groups (directory)
    description: Read-only group directory available to all authenticated callers
  - name: Secrets
    description: Shared-secret links (client scope)
  - name: Admin - Databases
    description: Database management (admin scope required)
  - name: Admin - Permissions
    description: Permission management (admin scope required)
  - name: Admin - Users
    description: User management (admin scope required)
  - name: Admin - Groups
    description: Group management (admin scope required)
  - name: Admin - Alerts
    description: Alert management (admin scope required)
  - name: Admin - Secrets
    description: Secret management (admin scope required)
  - name: Admin - Passkeys
    description: User passkey (WebAuthn credential) administration

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: Authenticate and obtain an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            The user account has FIDO2 (security key / passkey) configured as
            the second factor. The interactive FIDO2 challenge cannot be
            driven from a stateless REST request -- log in via the native
            Password Depot client, or ask an administrator to switch the
            user's `two_factor_mode` to `totp` or `email`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 409
                  message: "FIDO2 two-factor authentication is not supported via the REST API. Log in via the native Password Depot client, or ask an administrator to switch your second factor to TOTP or email."
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "459":
          description: Two-factor authentication not yet activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 459
                  message: "https://your-server:8714/v2.0/temp/qr123456.png"
        "460":
          description: Two-factor authentication code required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 460
                  message: "Password Depot Enterprise Server requires two-factor authentication."

  /auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      summary: Invalidate the current access token
      responses:
        "204":
          description: Logged out successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/oidc:
    get:
      operationId: getOidcProviders
      tags:
        - Authentication
      summary: List configured OpenID Connect providers
      security: []
      responses:
        "200":
          description: List of OIDC providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcProvider"

  # ---------------------------------------------------------------------------
  # Databases (client)
  # ---------------------------------------------------------------------------
  /databases:
    get:
      operationId: listDatabases
      tags:
        - Databases
      summary: List all databases
      description: Returns a paginated list of databases accessible by the authenticated user.
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of databases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DatabaseBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /databases/{id}:
    get:
      operationId: getDatabase
      tags:
        - Databases
      summary: Get a database by ID
      parameters:
        - $ref: "#/components/parameters/DatabaseId"
      responses:
        "200":
          description: Database details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Folders
  # ---------------------------------------------------------------------------
  /databases/{db}/folders:
    get:
      operationId: listFolders
      tags:
        - Folders
      summary: List folders in a database
      description: |
        Returns root-level folders by default. Use the `parent` query parameter
        to list children of a specific folder.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - name: parent
          in: query
          description: Parent folder ID to list children of. Omit for root-level folders.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of folders (basic representation)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FolderBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createFolder
      tags:
        - Folders
      summary: Create a new folder
      description: |
        Create a folder in the database. Set `parent` to an existing folder ID
        to create a subfolder, or omit it to create at root level.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Folder"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/folders/{id}:
    get:
      operationId: getFolder
      tags:
        - Folders
      summary: Get a folder by ID
      description: Returns the folder details including a list of child folder IDs.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200":
          description: Folder details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFolder
      tags:
        - Folders
      summary: Update a folder
      description: |
        Update a folder. When the target folder is second-password protected
        (`has_second_pass=true`), a correct `X-Second-Password` header is
        required and is verified; a wrong or missing one is rejected with
        `403` (`error.code` `4031`). To change the second password, send the
        new value in `X-New-Second-Password` together with the correct current
        `X-Second-Password`. Folders without a second password are unaffected.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/FolderId"
        - name: X-Second-Password
          in: header
          required: false
          description: |
            Current second password. Required (and verified) when the target
            folder is second-password protected; otherwise the request fails
            with `403` and `error.code` `4031`.
          schema:
            type: string
        - name: X-New-Second-Password
          in: header
          required: false
          description: |
            New second password to set. Must be accompanied by the correct
            current `X-Second-Password`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Folder"
      responses:
        "200":
          description: Folder updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Insufficient permissions, or -- when the folder is
            second-password protected -- a wrong or missing
            `X-Second-Password`. The latter case returns `error.code` `4031`
            (`PD_ERRCODE_INVALID_SECOND_PASS`); a generic access-denied keeps
            `error.code` `403`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFolder
      tags:
        - Folders
      summary: Delete a folder
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/FolderId"
      responses:
        "204":
          description: Folder deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Entries
  # ---------------------------------------------------------------------------
  /databases/{db}/entries:
    get:
      operationId: listEntries
      tags:
        - Entries
      summary: List entries in a database
      description: |
        Returns entries in the database. Use the `folder` query parameter to
        filter by folder. Supports pagination.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - name: folder
          in: query
          description: Filter entries by folder ID
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createEntry
      tags:
        - Entries
      summary: Create a new entry
      description: |
        Create an entry in the database. Set `folder_id` to place it in a
        folder, or omit it to create at root level.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/entries/{id}:
    get:
      operationId: getEntry
      tags:
        - Entries
      summary: Get a full entry by ID
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Full entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEntry
      tags:
        - Entries
      summary: Update an entry
      description: |
        Update an entry. When the target entry is second-password protected
        (`has_second_pass=true`), a correct `X-Second-Password` header is
        required and is verified; a wrong or missing one is rejected with
        `403` (`error.code` `4031`). To change the second password, send the
        new value in `X-New-Second-Password` together with the correct current
        `X-Second-Password`. Entries without a second password are unaffected.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/EntryId"
        - name: X-Second-Password
          in: header
          required: false
          description: |
            Current second password. Required (and verified) when the target
            entry is second-password protected; otherwise the request fails
            with `403` and `error.code` `4031`.
          schema:
            type: string
        - name: X-New-Second-Password
          in: header
          required: false
          description: |
            New second password to set. Must be accompanied by the correct
            current `X-Second-Password`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entry"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Insufficient permissions, or -- when the entry is second-password
            protected -- a wrong or missing `X-Second-Password`. The latter
            case returns `error.code` `4031`
            (`PD_ERRCODE_INVALID_SECOND_PASS`); a generic access-denied keeps
            `error.code` `403`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEntry
      tags:
        - Entries
      summary: Delete an entry
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: Entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /databases/{db}/entries/{id}/move:
    post:
      operationId: moveEntry
      tags:
        - Entries
      summary: Move an entry to a different folder
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveEntryRequest"
      responses:
        "200":
          description: Entry moved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------------------
  /databases/{db}/search:
    get:
      operationId: searchEntries
      tags:
        - Search
      summary: Search entries in a database
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - name: q
          in: query
          description: Search query string
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Admin Endpoints
  # ---------------------------------------------------------------------------

  # --- Admin Databases ---
  /admin/databases:
    get:
      operationId: adminListDatabases
      tags:
        - Admin - Databases
      summary: List all server databases (admin)
      description: Returns all databases on the server regardless of user permissions. Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of databases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DatabaseBasic"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: adminCreateDatabase
      tags:
        - Admin - Databases
      summary: Create a new database (admin)
      description: Requires an admin-scoped session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Database"
      responses:
        "201":
          description: Database created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/databases/{id}:
    get:
      operationId: adminGetDatabase
      tags:
        - Admin - Databases
      summary: Get a database by ID (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/DatabaseId"
      responses:
        "200":
          description: Database details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminUpdateDatabase
      tags:
        - Admin - Databases
      summary: Update a database (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/DatabaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Database"
      responses:
        "200":
          description: Database updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: adminDeleteDatabase
      tags:
        - Admin - Databases
      summary: Delete a database (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/DatabaseId"
      responses:
        "204":
          description: Database deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Admin Permissions ---
  /admin/databases/{db}/permissions:
    get:
      operationId: adminListPermissions
      tags:
        - Admin - Permissions
      summary: List permissions for a database (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: Paginated list of permissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: adminCreatePermission
      tags:
        - Admin - Permissions
      summary: Create a permission (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Permission"
      responses:
        "201":
          description: Permission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/databases/{db}/permissions/{id}:
    get:
      operationId: adminGetPermission
      tags:
        - Admin - Permissions
      summary: Get a permission by ID (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/PermissionId"
      responses:
        "200":
          description: Permission details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminUpdatePermission
      tags:
        - Admin - Permissions
      summary: Update a permission (admin)
      description: Requires an admin-scoped session.
      parameters:
        - $ref: "#/components/parameters/DatabaseIdPath"
        - $ref: "#/components/parameters/PermissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Permission"
      responses:
        "200":
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
